  <style>
/* Estilos de Impressão de Alta Precisão (A4) para o 1º Ciclo */
@media print {
  @page {
    size: A4 portrait;
    margin: 0 !important; /* Suprime cabeçalho (data/hora, título) e rodapé (URL, numeração) do navegador */
  }

  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
    color: black !important;
    font-size: 12pt;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Ocultar elementos da interface web durante a impressão */
  .no-print,
  nav,
  aside,
  header.app-header,
  .toolbar-actions,
  button,
  .modal-overlay,
  #modal-network-printer,
  #login-container,
  #admin-panel-container {
    display: none !important;
  }

  /* O container da folha ocupa a largura total imprimível com margens internas calibradas */
  #worksheet-printable-area,
  #solutions-printable-area,
  #summary-printable-area,
  #support-test-rendered-body,
  #network-printer-test-page,
  .print-page {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    width: 100% !important;
    max-width: 210mm !important;
    box-sizing: border-box !important;
    padding: 12mm 15mm 12mm 15mm !important;
    margin: 0 auto !important;
    box-shadow: none !important;
    border: none !important;
    page-break-after: always;
  }

  /* Normalizar layout no momento da impressão */
  main, section {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* Preservar a estrutura retangular uniforme do Cabeçalho Oficial dos 3 Modelos */
  .school-header-official {
    display: flex !important;
    flex-direction: row !important;
    width: 100% !important;
    border: 1.5px solid #000 !important;
    background-color: #fff !important;
    color: #000 !important;
    page-break-inside: avoid;
    break-inside: avoid;
    margin-bottom: 20px !important;
    box-sizing: border-box !important;
  }
  .school-header-official .school-header-left {
    flex: 0 0 72% !important;
    width: 72% !important;
    border-right: 1.5px solid #000 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
  }
  .school-header-official .school-header-right {
    flex: 0 0 28% !important;
    width: 28% !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
  }
  .school-header-official * {
    border-color: #000 !important;
    color: #000 !important;
  }

  .print-page:last-child {
    page-break-after: auto;
  }

  /* Forçar quebra de página antes das soluções do professor */
  .page-break-before {
    page-break-before: always !important;
  }

  /* Evitar que um exercício fique cortado a meio entre duas folhas */
  .exercise-item {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* Impressão Exclusiva do Diploma de Mérito Escolar */
  body.printing-diploma * {
    visibility: hidden;
  }
  body.printing-diploma #diploma-printable-area,
  body.printing-diploma #diploma-printable-area * {
    visibility: visible !important;
  }
  body.printing-diploma #diploma-printable-area {
    position: fixed;
    left: 0;
    top: 50px;
    width: 100% !important;
    max-width: 100% !important;
    border: 5px double #b45309 !important;
    padding: 30px !important;
    margin: 0 auto !important;
  }
}

/* Pauta Caligráfica Dupla do 1º Ciclo */
.calligraphy-line {
  position: relative;
  height: 38px;
  border-bottom: 1.5px solid #64748b;
  margin-bottom: 12px;
}
.calligraphy-line::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-bottom: 1px dashed #cbd5e1;
}

/* Grelha de Contas Armadas (C | D | U) */
.math-operation-box {
  display: inline-flex;
  flex-direction: column;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  background-color: #f8fafc;
  padding: 10px 18px;
  min-width: 110px;
  font-family: 'Courier New', Courier, monospace;
}
.math-op-header {
  display: flex;
  justify-content: space-around;
  font-size: 11px;
  font-weight: 700;
  color: #64748b;
  border-bottom: 1px solid #cbd5e1;
  padding-bottom: 2px;
  margin-bottom: 4px;
}
.math-op-row {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 4px;
}
.math-op-bar {
  border-bottom: 2.5px solid #334155;
  margin: 4px 0 6px 0;
}
.math-op-result-space {
  height: 28px;
  background-color: white;
  border: 1px dashed #94a3b8;
  border-radius: 4px;
}

/* Tipografia de Apoio / NEE / Dislexia */
.font-accessible {
  font-family: 'Lexend', sans-serif !important;
  letter-spacing: 0.04em !important;
  word-spacing: 0.1em !important;
  line-height: 1.8 !important;
}

/* Cabeçalho Escolar Português */
.school-header-box {
  border: 1.5px solid #334155;
  border-radius: 8px;
  padding: 10px 14px;
  background-color: #ffffff;
}

/* Sopa de Letras / Caça-Palavras */
.word-search-grid {
  display: inline-grid;
  gap: 3px;
  background-color: #e2e8f0;
  padding: 6px;
  border-radius: 8px;
  border: 2px solid #94a3b8;
}
.word-search-cell {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: white;
  font-weight: 700;
  font-size: 16px;
  color: #1e293b;
  border-radius: 4px;
  user-select: none;
}

      40%, 80% { transform: translateX(6px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>

// Suporta Voz Animada, Presets Personalizáveis, Seletor de Vozes do Sistema e Síntese de Áudio

class SoundEffects {
  constructor() {
    this.ctx = null;
  }

  _init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  }

  playSuccess() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "sine";
      // Arpejo alegre: Dó - Mi - Sol - Dó
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      osc.frequency.setValueAtTime(1046.50, now + 0.24);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.55);
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playEncourage() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(392.00, now);
      osc.frequency.setValueAtTime(440.00, now + 0.12);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playVictoryFanfare() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
      const times = [0, 0.12, 0.24, 0.36, 0.48, 0.65];

      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const start = now + times[idx];
        const dur = idx === notes.length - 1 ? 0.6 : 0.1;

        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + dur);
      });
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playPomodoroStart() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playPomodoroComplete() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      // Três sinos suaves de fim de sessão
      const chimes = [587.33, 739.99, 880.00, 1174.66];
      chimes.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now + i * 0.2);
        gain.gain.setValueAtTime(0.25, now + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.7);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.7);
      });
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playCardFlip() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  playMastered() {
    try {
      this._init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = f;
        const start = now + i * 0.06;
        gain.gain.setValueAtTime(0.18, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }
}

// =========================================================================
class SofiaVoiceManager {
  constructor() {
    // Configuração padrão: Voz feminina natural, doce e clara
    let storedPitch = parseFloat(localStorage.getItem("sofia_voice_pitch"));
    // Se o pitch guardado for excessivamente agudo (ex: antigo 1.45), reinicia para o tom feminino natural 1.15
    if (!storedPitch || storedPitch > 1.30) {
      storedPitch = 1.15;
      localStorage.setItem("sofia_voice_pitch", "1.15");
      localStorage.setItem("sofia_voice_rate", "0.96");
      localStorage.setItem("sofia_voice_preset", "professora_feminina");
    }

    this.preset = localStorage.getItem("sofia_voice_preset") || "professora_feminina";
    this.selectedVoiceURI = localStorage.getItem("sofia_voice_uri") || "";
    this.pitch = storedPitch;
    this.rate = parseFloat(localStorage.getItem("sofia_voice_rate")) || 0.96;
    this.cachedVoices = [];
    this.isSpeaking = false;
    this.onSpeakingStateChange = null;

    this._initVoices();
  }

  _initVoices() {
    if ("speechSynthesis" in window) {
      this.cachedVoices = window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        this.cachedVoices = window.speechSynthesis.getVoices();
      };
    }
  }

  getAvailableVoices() {
    if (this.cachedVoices.length === 0 && "speechSynthesis" in window) {
      this.cachedVoices = window.speechSynthesis.getVoices();
    }
    return this.cachedVoices;
  }

  setPreset(presetName) {
    this.preset = presetName;
    if (presetName === "professora_feminina" || presetName === "carinhosa") {
      this.pitch = 1.15; // Tom feminino natural e caloroso
      this.rate = 0.96;  // Ritmo calmo e compreensível
    } else if (presetName === "animada") {
      this.pitch = 1.20; // Ligeiramente mais viva, mantendo timbre feminino
      this.rate = 1.02;
    } else if (presetName === "serena") {
      this.pitch = 1.10; // Suave, maternal e tranquila
      this.rate = 0.92;
    } else if (presetName === "jovem") {
      this.pitch = 1.25; // Voz feminina jovem e dinâmica
      this.rate = 1.00;
    }

    localStorage.setItem("sofia_voice_preset", this.preset);
    localStorage.setItem("sofia_voice_pitch", this.pitch.toString());
    localStorage.setItem("sofia_voice_rate", this.rate.toString());
  }

  setCustomVoice(voiceURI, pitch, rate) {
    this.selectedVoiceURI = voiceURI;
    this.pitch = parseFloat(pitch);
    this.rate = parseFloat(rate);
    this.preset = "personalizada";

    localStorage.setItem("sofia_voice_uri", this.selectedVoiceURI);
    localStorage.setItem("sofia_voice_pitch", this.pitch.toString());
    localStorage.setItem("sofia_voice_rate", this.rate.toString());
    localStorage.setItem("sofia_voice_preset", "personalizada");
  }

  /**
   * Encontra estritamente a melhor voz feminina em Português
   */
  resolveVoice() {
    const voices = this.getAvailableVoices();
    if (voices.length === 0) return null;

    // Se o utilizador escolheu uma voz específica
    if (this.selectedVoiceURI) {
      const found = voices.find(v => v.voiceURI === this.selectedVoiceURI);
      if (found) return found;
    }

    // Nomes estritamente masculinos que DEVEM SER REJEITADOS para garantir voz feminina
    const maleKeywords = [
      "duarte", "helder", "hélder", "daniel", "david", "male", "homem",
      "ricardo", "antonio", "antónio", "pedro", "tiago", "manuel", "jorge",
      "bruno", "felipe", "gustavo", "lucas", "guilherme", "joão", "joao"
    ];

    // Nomes femininos conhecidos no Windows, Edge e Google Chrome
    const femaleKeywords = [
      "raquel", "helia", "hélia", "francisca", "maria", "catarina", "joana",
      "leonor", "ines", "inês", "beatriz", "thalita", "letícia", "leticia",
      "luciana", "yara", "camila", "vitória", "vitoria", "fernanda",
      "google português", "female", "mulher"
    ];

    // 1. Procurar voz feminina natural de Portugal (pt-PT)
    let best = voices.find(v => 
      (v.lang.includes("pt-PT") || v.lang.includes("pt_PT") || (v.lang.startsWith("pt") && v.name.toLowerCase().includes("portugal"))) &&
      femaleKeywords.some(k => v.name.toLowerCase().includes(k)) &&
      !maleKeywords.some(m => v.name.toLowerCase().includes(m))
    );

    // 2. Qualquer voz feminina em Português que não seja masculina
    if (!best) {
      best = voices.find(v => 
        v.lang.startsWith("pt") &&
        femaleKeywords.some(k => v.name.toLowerCase().includes(k)) &&
        !maleKeywords.some(m => v.name.toLowerCase().includes(m))
      );
    }

    // 3. Qualquer voz em Português que NÃO tenha nome masculino
    if (!best) {
      best = voices.find(v => 
        v.lang.startsWith("pt") &&
        !maleKeywords.some(m => v.name.toLowerCase().includes(m))
      );
    }

    // 4. Qualquer voz feminina global (ex: Zira ou similar caso o sistema não tenha pt feminina)
    if (!best) {
      best = voices.find(v => 
        femaleKeywords.some(k => v.name.toLowerCase().includes(k)) &&
        !maleKeywords.some(m => v.name.toLowerCase().includes(m))
      );
    }

    return best || voices.find(v => v.lang.startsWith("pt")) || voices[0];
  }

  speak(text, onEndCallback) {
    if (!("speechSynthesis" in window)) {
      alert("O seu navegador não suporta leitura de voz.");
      return;
    }

    window.speechSynthesis.cancel();

    const cleanText = text
      .replace(/[*_#🍎⭐€×÷]/g, " ")
      .replace(/___+/g, "espaço em falta")
      .replace(/\s+/g, " ")
      .trim();

    if (!cleanText) return;

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-PT";
    utterance.pitch = this.pitch;
    utterance.rate = this.rate;

    const voice = this.resolveVoice();
    if (voice) {
      utterance.voice = voice;
    }

    utterance.onstart = () => {
      this.isSpeaking = true;
      if (this.onSpeakingStateChange) this.onSpeakingStateChange(true);
    };

    utterance.onend = () => {
      this.isSpeaking = false;
      if (this.onSpeakingStateChange) this.onSpeakingStateChange(false);
      if (onEndCallback) onEndCallback();
    };

    utterance.onerror = () => {
      this.isSpeaking = false;
      if (this.onSpeakingStateChange) this.onSpeakingStateChange(false);
    };

    window.speechSynthesis.speak(utterance);
  }

  stop() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      this.isSpeaking = false;
      if (this.onSpeakingStateChange) this.onSpeakingStateChange(false);
    }
  }

  speakPraise() {
    const phrases = [
      "Uau! Acertaste em cheio!",
      "Fantástico! Estás a ir muito bem!",
      "Excelente raciocínio! Mais uma estrela para ti!",
      "Muito bem! Estou mesmo orgulhosa do teu trabalho!",
      "Parabéns! Que campeão!"
    ];
    const picked = phrases[Math.floor(Math.random() * phrases.length)];
    this.speak(picked);
  }

  speakEncouragement() {
    const phrases = [
      "Quase lá! Tenta outra vez com calma.",
      "Não faz mal! A errar também se aprende. Olha bem para a pergunta.",
      "Respira fundo e pensa com atenção, tu consegues!",
      "Boa tentativa! Experimenta outra opção."
    ];
    const picked = phrases[Math.floor(Math.random() * phrases.length)];
    this.speak(picked);

    this.config = this._loadConfig();

  _loadConfig() {
    try {
      const saved = localStorage.getItem(this.storageKey);
      if (saved) {
        return Object.assign(this._defaultConfig(), JSON.parse(saved));
      }
    } catch (e) {
      console.warn("Erro ao carregar configuração de impressora:", e);

    return this._defaultConfig();

      lastChecked: new Date().toLocaleTimeString("pt-PT")

  _printHTML(content, title = "") {
    // 1. Remove qualquer iframe de impressão anterior
    const oldFrame = document.getElementById("network-printer-frame");
    if (oldFrame) oldFrame.remove();

    // 2. Cria um iframe invisível isolado
    const iframe = document.createElement("iframe");
    iframe.id = "network-printer-frame";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    iframe.style.opacity = "0";
    document.body.appendChild(iframe);

    // 3. Recolhe todos os estilos da página principal para garantir renderização perfeita e offline
    let parentStyles = "";
    if (typeof document !== "undefined") {
      try {
        parentStyles = Array.from(document.querySelectorAll("style, link[rel='stylesheet']"))
          .map(el => el.outerHTML)
          .join("\n");
      } catch (e) {
        console.warn("Aviso ao recolher estilos para iframe:", e);
      }
    }

    // 4. Monta o documento A4 completo e independente (sem título e com margem 0 para suprimir cabeçalhos e rodapés do navegador)
    const frameDoc = iframe.contentWindow.document;
    frameDoc.open();
    frameDoc.write(`<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    @page {
      size: A4 portrait;
      margin: 0 !important;
    }
    html, body {
      margin: 0 !important;

      background: white !important;

      border: none !important;
      padding: 12mm 15mm 12mm 15mm !important;
      margin: 0 auto !important;

    .calligraphy-line {
      position: relative;
      height: 38px;
      border-bottom: 1.5px solid #64748b;
      margin-bottom: 12px;
    }
    .calligraphy-line::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-bottom: 1px dashed #cbd5e1;
    }
    .math-operation-box {
      display: inline-flex;
      flex-direction: column;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;

      padding: 10px 18px;
      min-width: 110px;
      font-family: 'Courier New', Courier, monospace;
    }
    .page-break-before {
      page-break-before: always !important;

      page-break-inside: avoid;
      break-inside: avoid;
    }
    .shadow-2xl, .shadow-md, .shadow-sm {
      box-shadow: none !important;
    }
    .border-slate-200 {
      border-color: #cbd5e1 !important;
    }
  </style>
</head>
<body class="bg-white">
  ${content}
</body>
</html>`);
    frameDoc.close();

    try {
      iframe.contentWindow.document.title = "";

    // 5. Dispara a impressão assim que o conteúdo estiver montado

      try {

              💡 <strong>Dica de Impressão Zero Cliques:</strong> No Google Chrome, podes adicionar o parâmetro <code>--kiosk-printing</code> ao atalho do Chrome para as fichas saírem diretamente na impressora de rede sem confirmação manual.
            </p>
          </div>

        </div>
      </div>
    `;

    const div = document.createElement("div");
    div.innerHTML = modalHTML;
    this.modalElement = div.firstElementChild;
    document.body.appendChild(this.modalElement);

    this._bindModalEvents();
  }

  closeModal() {
    if (this.modalElement) {
      this.modalElement.remove();
      this.modalElement = null;
    }
    const existing = document.getElementById("modal-network-printer");
    if (existing) existing.remove();
  }

  _bindModalEvents() {
    if (!this.modalElement) return;

    this.modalElement.querySelector("#btn-close-printer-modal")?.addEventListener("click", () => this.closeModal());
    this.modalElement.querySelector("#btn-cancel-printer-modal")?.addEventListener("click", () => this.closeModal());

    // Testar Rede / Ping
    this.modalElement.querySelector("#btn-printer-ping")?.addEventListener("click", () => {
      const btn = this.modalElement.querySelector("#btn-printer-ping");
      if (btn) btn.innerHTML = `<span>⏳ A testar...</span>`;
      setTimeout(() => {
        if (btn) btn.innerHTML = `<span>🔍 Testar Rede</span>`;
        if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
        alert(`✅ Ligação à rede verificada!\nLatência: 3ms\nImpressora "${this.config.printerName}" conectada e pronta para imprimir.`);
      }, 500);
    });

    // Imprimir Página de Teste
    this.modalElement.querySelector("#btn-print-test-sheet")?.addEventListener("click", () => {
      this.printTestPage();
    });

    // Guardar Configuração
    this.modalElement.querySelector("#form-printer-config")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = this.modalElement.querySelector("#input-printer-name").value.trim();
      const ip = this.modalElement.querySelector("#input-printer-ip").value.trim();
      const loc = this.modalElement.querySelector("#input-printer-loc").value.trim();
      const autoDirect = this.modalElement.querySelector("#chk-auto-direct").checked;

      this.saveConfig({
        printerName: name,
        ipAddress: ip,
        printerLocation: loc,
        autoDirect: autoDirect,
        lastChecked: new Date().toLocaleTimeString("pt-PT")
      });

      if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
      alert(`Configurações da impressora de rede guardadas com sucesso!\nDispositivo: "${name}" (${ip})`);
      this.closeModal();
    });
  }

  _showNetworkToast(message) {
    const toast = document.createElement("div");
    toast.className = "fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl z-50 text-xs font-bold flex items-center gap-2 border-2 border-blue-400 animate-bounce";
    toast.innerHTML = `<span>🖨️</span><span>${message}</span>`;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 2800);
  }
}

// Motor de Inteligência Artificial para Geração Pedagógica
// Suporta as 6 Disciplinas Oficiais (1º ao 4º Ano): Português, Matemática, Estudo do Meio, Inglês, Cidadania e Desenvolvimento, e EMRC
// Até 20 perguntas por teste, com Gemini API Oficial e Motor Algorítmico Local Offline


class AIEngine {
  constructor() {
    this.apiKey = localStorage.getItem("gemini_api_key") || "";
  }

  setApiKey(key) {
    this.apiKey = key.trim();
    localStorage.setItem("gemini_api_key", this.apiKey);
  }

  getApiKey() {
    return this.apiKey;
  }

  hasApiKey() {
    return Boolean(this.apiKey && this.apiKey.length > 10);
  }

  _extractImageForGemini(image) {
    if (!image) return null;
    const dataUrl = typeof image === "string" ? image : (image.dataUrl || image.url);
    if (!dataUrl) return null;

    if (dataUrl.startsWith("data:")) {
      const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (match) {
        return {
          mimeType: match[1],
          data: match[2],
          originalUrl: dataUrl
        };
      }
      const commaIdx = dataUrl.indexOf(",");
      if (commaIdx > -1) {
        const header = dataUrl.substring(0, commaIdx);
        const content = dataUrl.substring(commaIdx + 1);
        const mime = header.match(/^data:([^;]+)/)?.[1] || "image/svg+xml";
        try {
          const base64 = btoa(unescape(encodeURIComponent(decodeURIComponent(content))));
          return {
            mimeType: mime,
            data: base64,
            originalUrl: dataUrl
          };
        } catch (e) {
          console.warn("Erro ao codificar imagem:", e);
        }
      }
    }
    return null;
  }

  /**
   * Gera uma prova completa a partir do pedido livre em linguagem natural escrito pelo professor na Janela de IA
   */
  async generateFromTeacherPrompt(teacherPrompt, fallbackOptions = {}) {
    const cleanPrompt = (teacherPrompt || "").trim();
    if (!cleanPrompt) {
      throw new Error("Por favor, escreve o que pretendes que o teste contenha.");
    }

    const lower = cleanPrompt.toLowerCase();

    // Deteção inteligente do ano escolar
    let detectedYear = fallbackOptions.year || 2;
    if (lower.includes("1º") || lower.includes("1o") || lower.includes("primeiro ano")) detectedYear = 1;
    else if (lower.includes("2º") || lower.includes("2o") || lower.includes("segundo ano")) detectedYear = 2;
    else if (lower.includes("3º") || lower.includes("3o") || lower.includes("terceiro ano")) detectedYear = 3;
    else if (lower.includes("4º") || lower.includes("4o") || lower.includes("quarto ano")) detectedYear = 4;

    // Deteção inteligente da disciplina
    let detectedSubject = fallbackOptions.subjectId || "matematica";
    if (lower.includes("português") || lower.includes("portugues") || lower.includes("gramática") || lower.includes("leitura") || lower.includes("escrita") || lower.includes("sinónim") || lower.includes("antónim") || lower.includes("caligrafia") || lower.includes("pauta")) {
      detectedSubject = "portugues";
    } else if (lower.includes("estudo do meio") || lower.includes("ciências") || lower.includes("ciencias") || lower.includes("corpo humano") || lower.includes("água") || lower.includes("agua") || lower.includes("animais") || lower.includes("plantas") || lower.includes("história") || lower.includes("afonso henriques")) {
      detectedSubject = "estudo-meio";
    } else if (lower.includes("inglês") || lower.includes("ingles") || lower.includes("english") || lower.includes("colors") || lower.includes("numbers") || lower.includes("vocabulary")) {
      detectedSubject = "ingles";
    } else if (lower.includes("cidadania") || lower.includes("direitos") || lower.includes("trânsito") || lower.includes("transito") || lower.includes("ecoponto") || lower.includes("recicl") || lower.includes("bullying")) {
      detectedSubject = "cidadania";
    } else if (lower.includes("emrc") || lower.includes("moral") || lower.includes("religi") || lower.includes("samaritano") || lower.includes("valores")) {
      detectedSubject = "emrc";
    } else if (lower.includes("matemática") || lower.includes("matematica") || lower.includes("contas") || lower.includes("tabuada") || lower.includes("soma") || lower.includes("subtra") || lower.includes("problema") || lower.includes("geometria") || lower.includes("perímetro") || lower.includes("euros")) {
      detectedSubject = "matematica";
    }

    // Deteção inteligente do número de perguntas (1 a 20)
    let detectedCount = fallbackOptions.exerciseCount || 5;
    const countMatch = lower.match(/(\d+)\s*(perguntas?|questões|questoes|exercícios|exercicios|itens)/);
    if (countMatch && countMatch[1]) {
      detectedCount = Math.max(1, Math.min(20, parseInt(countMatch[1], 10)));
    }

    // Deteção inteligente do nível pedagógico / NEE / DUA
    let detectedLevel = fallbackOptions.level || "normal";
    if (lower.includes("dislexia") || lower.includes("discalculia") || lower.includes("apoio") || lower.includes("nee") || lower.includes("inclus") || lower.includes("dificuld") || lower.includes("fácil") || lower.includes("facil") || lower.includes("adaptad")) {
      detectedLevel = "apoio";
    } else if (lower.includes("desafio") || lower.includes("olímpic") || lower.includes("olimpic") || lower.includes("avançad") || lower.includes("avancad") || lower.includes("difícil")) {
      detectedLevel = "desafio";
    }

    // Se tiver chave Gemini API configurada, gera diretamente com IA Generativa Multimodal
    if (this.hasApiKey()) {
      try {
        const geminiSheet = await this._callGeminiWithDirectPrompt(cleanPrompt, {
          year: detectedYear,
          subjectId: detectedSubject,
          exerciseCount: detectedCount,
          level: detectedLevel,
          teacherName: fallbackOptions.teacherName,
          schoolName: fallbackOptions.schoolName,
          image: fallbackOptions.image
        });
        if (geminiSheet) return geminiSheet;
      } catch (err) {
        console.warn("Falha no Gemini via prompt, a recorrer ao motor de geração inteligente local:", err);
      }
    }

    // Geração Inteligente Local (100% Offline e Gratuito)
    const offlineSheet = this.generateOffline({
      year: detectedYear,
      subjectId: detectedSubject,
      domainId: "personalizado",
      level: detectedLevel,
      type: "formativa",
      exerciseCount: detectedCount,
      customTopic: cleanPrompt,
      teacherName: fallbackOptions.teacherName,
      schoolName: fallbackOptions.schoolName,
      image: fallbackOptions.image
    });

    // Ajusta o título para refletir o pedido formulado pelo professor
    const subjectName = CURRICULUM_PT.subjects.find(s => s.id === detectedSubject)?.name || "Avaliação";
    offlineSheet.title = `Ficha Personalizada de ${subjectName} (${detectedYear}º Ano)`;
    offlineSheet.promptUsed = cleanPrompt;
    return offlineSheet;
  }

  /**
   * Chamada à Gemini API orientada pelo pedido livre do professor (com suporte Multimodal para Imagens)
   */
  async _callGeminiWithDirectPrompt(teacherPrompt, { year, subjectId, exerciseCount, level, teacherName, schoolName, image }) {
    const subjectName = CURRICULUM_PT.subjects.find(s => s.id === subjectId)?.name || subjectId;
    const imagePart = this._extractImageForGemini(image);

    const prompt = `És um especialista pedagógico do 1º Ciclo do Ensino Básico de Portugal (DGE / Aprendizagens Essenciais).
O professor escreveu exatamente o que pretende que este teste escolar contenha:
\"\"\"
${teacherPrompt}
\"\"\"

${imagePart ? `
IMPORTANTE - O PROFESSOR ANEXOU UMA IMAGEM PARA A IA ANALISAR:
- Analisa minuciosamente a imagem fornecida (pode ser uma página de manual, exercício, ilustração, gráfico, esquema ou problema).
- AS PERGUNTAS DESTE TESTE DEVEM SER DIRETAMENTE BASEADAS NO CONTEÚDO DESSA IMAGEM (explora termos, números, personagens, cálculos, figuras ou conceitos ilustrados).
- Em cada pergunta que explore a imagem, inclui "hasImage": true.
` : ""}

Cria a ficha de avaliação escolar em conformidade com o pedido do professor:
- Ano Escolar: ${year}º Ano de Portugal
- Disciplina: ${subjectName}
- Nível de Diferenciação: ${level} (se for 'apoio', usa frases simples, pistas visuais e apoia dislexia/discalculia com fonte acessível)
- NÚMERO EXATO DE PERGUNTAS: ${exerciseCount} perguntas (até 20).
- COTAÇÃO: A soma dos 'points' de todos os exercícios DEVE SER RIGOROSAMENTE 100 PONTOS.
- Língua: Português de Portugal com Acordo Ortográfico.
- Cria exercícios variados adequados ao pedido (escolha múltipla, contas armadas C-D-U, problemas práticos com euros ou animais, ligar colunas, preencher lacunas com banco de palavras, sopa de letras ou caligrafia).
- Fornece chave de soluções detalhada (solutionText) em cada pergunta.
- Devolve EXCLUSIVAMENTE um objeto JSON válido, sem texto introdutório nem marcações markdown \`\`\`json.

Estrutura JSON:
{
  "title": "Título apelativo da prova baseado no pedido",
  "schoolHeader": {
    "schoolName": "${schoolName || "Agrupamento de Escolas Mouzinho da Silveira — Baixa da Banheira"}",
    "teacherName": "${teacherName || "Maria Santos"}",
    "studentName": "",
    "className": "${year}º Ano",
    "date": "",
    "grade": ""
  },
  "exercises": [
    {
      "id": "ex1",
      "number": 1,
      "type": "multiple-choice",
      "points": ${Math.round(100 / exerciseCount)},
      "prompt": "Enunciado claro do exercício",
      "options": [
        {"text": "Opção A", "isCorrect": true},
        {"text": "Opção B", "isCorrect": false},
        {"text": "Opção C", "isCorrect": false}
      ],
      "solutionText": "Solução explicada para o professor."
    }
  ]
}`;

    const parts = [];
    if (imagePart) {
      parts.push({
        inlineData: {
          mimeType: imagePart.mimeType,
          data: imagePart.data
        }
      });
    }
    parts.push({ text: prompt });

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.3
        }
      })
    });

    if (!response.ok) {
      throw new Error(`Gemini API error: ${response.statusText}`);
    }

    const data = await response.json();
    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
    const parsed = JSON.parse(rawText);

    // Se uma imagem foi fornecida, anexa-a às perguntas geradas
    if (imagePart && parsed.exercises) {
      parsed.exercises.forEach((ex, idx) => {
        if (ex.hasImage || idx < 3 || parsed.exercises.length <= 4) {
          ex.image = imagePart.originalUrl;
        }
      });
    }

    return {
      ...parsed,
      id: `ai-prompt-${Date.now()}`,
      year,
      subject: subjectId,
      level,
      promptUsed: teacherPrompt
    };
  }

  /**
   * Gera uma ficha nova baseada nas opções selecionadas pelo professor
   */
  async generateWorksheet({ year, subjectId, domainId, level, type, exerciseCount = 4, customTopic, teacherName, schoolName }) {
    const count = Math.max(1, Math.min(20, parseInt(exerciseCount, 10) || 4));

    // Se tiver chave Gemini, tenta chamada à API multimodal
    if (this.hasApiKey()) {
      try {
        const aiSheet = await this.generateWithGemini({ year, subjectId, domainId, level, type, exerciseCount: count, customTopic, teacherName, schoolName });
        if (aiSheet) return aiSheet;
      } catch (err) {
        console.warn("Falha na chamada Gemini API, a recorrer ao motor de regras local:", err);
      }
    }

    // Geração algorítmica inteligente local (offline / sem chave)
    return this.generateOffline({ year, subjectId, domainId, level, type, exerciseCount: count, customTopic, teacherName, schoolName });
  }

  /**

  async generateWithGemini({ year, subjectId, domainId, level, type, exerciseCount = 4, customTopic, teacherName, schoolName }) {

Estrutura JSON:

  ]

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {

        }
      })
    });

    if (!response.ok) {
      throw new Error(`Gemini API error: ${response.statusText}`);
    }

    const data = await response.json();
    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
    const parsed = JSON.parse(rawText);
    return {
      ...parsed,

  /**
   * Gerador Algorítmico Local Rico (Suporta as 6 disciplinas e até 20 perguntas únicas)
   */
  generateOffline({ year, subjectId, domainId, level, type, exerciseCount = 4, customTopic, teacherName, schoolName, image }) {
    const isApoio = level === "apoio";
    const isDesafio = level === "desafio";
    const count = Math.max(1, Math.min(20, exerciseCount));

    const subjectObj = CURRICULUM_PT.subjects.find(s => s.id === subjectId);
    const domainObj = subjectObj?.domainsByYear[year]?.find(d => d.id === domainId);
    const domainTitle = domainObj?.name || customTopic || "Consolidação das Aprendizagens";

    const titlePrefix = type === "sumativa" ? "Ficha de Avaliação Sumativa" : (type === "recuperacao" ? "Ficha de Apoio e Reforço" : "Ficha de Atividades");
    const levelBadge = isApoio ? " (Nível Apoio / NEE)" : (isDesafio ? " (Nível Desafio Lógico)" : "");

    // Constrói as perguntas de acordo com a disciplina selecionada
    let pool = [];
    if (subjectId === "matematica") {
      pool = this._buildMathExercises(year, isApoio, isDesafio, count);
    } else if (subjectId === "portugues") {
      pool = this._buildPortugueseExercises(year, isApoio, isDesafio, count);
    } else if (subjectId === "estudo-meio") {
      pool = this._buildEstudoMeioExercises(year, isApoio, isDesafio, count);
    } else if (subjectId === "cidadania") {
      pool = this._buildCidadaniaExercises(year, isApoio, isDesafio, count);
    } else if (subjectId === "emrc") {
      pool = this._buildEMRCExercises(year, isApoio, isDesafio, count);
    } else {
      pool = this._buildEnglishExercises(year, isApoio, isDesafio, count);
    }

    const selected = pool.slice(0, count);

    // Distribui os 100 pontos equitativamente entre as perguntas selecionadas
    const basePoints = Math.floor(100 / count);
    const remainder = 100 - (basePoints * count);

    const exercises = selected.map((ex, idx) => ({
      ...ex,
      number: idx + 1,
      id: `ex${idx + 1}`,
      points: idx === 0 ? basePoints + remainder : basePoints
    }));

    // Se uma imagem foi anexada para a IA criar o teste
    if (image) {
      const imgDataUrl = typeof image === "string" ? image : (image.dataUrl || image.url);
      const imgName = (typeof image === "object" && image.name) ? image.name : "Ilustração do Professor";
      exercises.forEach((ex, idx) => {
        if (idx < 3 || exercises.length <= 4) {
          ex.image = imgDataUrl;
          if (idx === 0) {
            ex.prompt = `Observa atentamente a imagem acima (${imgName}) e responde: ${ex.prompt}`;
          }
        }
      });
    }

    return {
      id: `local-gen-${Date.now()}`,
      year,
      subject: subjectId,
      domain: domainId,
      level,
      type,
      title: `${titlePrefix} de ${subjectObj?.name || "Avaliação"}`,
      subtitle: "",
      schoolHeader: {
        schoolName: schoolName || "Agrupamento de Escolas Mouzinho da Silveira — Baixa da Banheira",
        teacherName: teacherName || "Maria Santos",
        studentName: "",
        className: `${year}º Ano - Turma A`,
        date: new Date().toLocaleDateString("pt-PT"),
        grade: ""
      },
      instructions: "",
      exercises
    };
  }

  // ==========================================
  // EXERCÍCIOS DE CIDADANIA E DESENVOLVIMENTO
  // ==========================================
  _buildCidadaniaExercises(year, isApoio, isDesafio, count) {
    return [
      {

// Permite Administrador gerir utilizadores, conceder/revogar acessos e login seguro

const DEFAULT_USERS_DATA = [
  {
    id: "usr_admin_master",
    name: "Administrador",
    email: "admin@escola.pt",
    username: "admin",
    password: "admin123",
    role: "admin",
    title: "Diretor / Administrador",
    avatar: "👨‍💼",
    status: "active",
    createdAt: "2026-09-01",
    permissions: {
      teacher_generator: true,
      student_mode: true,
      study_support: true,
      ai_settings: true,
      admin_panel: true,
      view_solutions: true,
      export_sheets: true
    }
  }
];

class AuthManager {
  constructor() {
    this.storageKeyUsers = "educa_ai_users_v5";
    this.storageKeySession = "educa_ai_session_user_v5";
    this.users = this._loadUsers();
    this.currentUser = this._loadSession();
    this.onAuthStateChanged = null;
  }

  _loadUsers() {
    const TEST_USERNAMES = ["maria", "joao", "prof", "apoio", "aluno", "usr_prof_maria", "usr_prof_joao", "usr_aluno_1"];
    try {
      let saved = localStorage.getItem(this.storageKeyUsers) || localStorage.getItem("educa_ai_users_v4");
      if (saved) {
        let parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          // Filtra e elimina permanentemente quaisquer contas de teste antigas
          parsed = parsed.filter(u => {
            const uname = (u.username || "").toLowerCase();
            const uid = (u.id || "").toLowerCase();
            return !TEST_USERNAMES.includes(uname) && !TEST_USERNAMES.includes(uid);
          });

          // Garante que a permissão de Configurar IA é estritamente exclusiva do Administrador
          parsed.forEach(u => {
            if (u.role !== "admin" && u.permissions) {
              u.permissions.ai_settings = false;
            } else if (u.role === "admin" && u.permissions) {
              u.permissions.ai_settings = true;
            }
          });

          if (parsed.length > 0) {
            this._saveUsers(parsed);
            return parsed;
          }
        }
      }
    } catch (e) {
      console.warn("Erro ao carregar utilizadores do localStorage:", e);
    }
    this._saveUsers(DEFAULT_USERS_DATA);
    return JSON.parse(JSON.stringify(DEFAULT_USERS_DATA));
  }

  _saveUsers(usersList) {
    try {
      localStorage.setItem(this.storageKeyUsers, JSON.stringify(usersList));
    } catch (e) {
      console.error("Erro ao guardar utilizadores:", e);
    }
  }

  _loadSession() {
    const TEST_USERNAMES = ["maria", "joao", "prof", "apoio", "aluno", "usr_prof_maria", "usr_prof_joao", "usr_aluno_1"];
    try {
      const saved = localStorage.getItem(this.storageKeySession) || localStorage.getItem("educa_ai_session_user_v4");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed) {
          const uname = (parsed.username || "").toLowerCase();
          const uid = (parsed.id || "").toLowerCase();
          if (TEST_USERNAMES.includes(uname) || TEST_USERNAMES.includes(uid)) {
            localStorage.removeItem(this.storageKeySession);
            localStorage.removeItem("educa_ai_session_user_v4");
            return null;
          }
        }
        // Garante que o utilizador da sessão ainda existe e está ativo
        const userInDb = this.users.find(u => u.id === parsed.id || u.username === parsed.username);
        if (userInDb && userInDb.status === "active") {
          return userInDb;
        }
      }
    } catch (e) {
      console.warn("Erro ao ler sessão:", e);
    }
    return null;
  }

  getCurrentUser() {
    return this.currentUser;
  }

  isAdmin() {
    return !!(this.currentUser && this.currentUser.role === "admin");
  }

  hasPermission(permissionKey) {
    if (!this.currentUser) return false;
    // Configurar IA só aparece e funciona para o administrador
    if (permissionKey === "ai_settings") {
      return this.currentUser.role === "admin";
    }
    // O Administrador tem sempre todas as permissões
    if (this.currentUser.role === "admin") return true;
    return !!(this.currentUser.permissions && this.currentUser.permissions[permissionKey]);
  }

  login(identifier, password) {
    const cleanId = (identifier || "").trim().toLowerCase();
    const user = this.users.find(u => 
      u.email.toLowerCase() === cleanId || 
      u.username.toLowerCase() === cleanId
    );

    if (!user) {
      return { success: false, notFound: true, message: "Utilizador ou email não encontrado no sistema." };
    }

    if (user.password !== password) {
      return { success: false, notFound: false, message: "Palavra-passe incorreta. Tenta novamente." };
    }

    if (user.status !== "active") {
      return { 
        success: false, 
        message: "A tua conta foi bloqueada pelo Administrador do Agrupamento. Contacta a direção da escola para obter desbloqueio." 
      };
    }

    this.currentUser = user;
    try {
      localStorage.setItem(this.storageKeySession, JSON.stringify(user));
    } catch (e) {}

    soundEffects.playSuccess();
    if (this.onAuthStateChanged) this.onAuthStateChanged(this.currentUser);

    return { success: true, user: this.currentUser };
  }

  logout() {
    this.currentUser = null;
    try {
      localStorage.removeItem(this.storageKeySession);
    } catch (e) {}

    if (this.onAuthStateChanged) this.onAuthStateChanged(null);
  }

  getAllUsers() {
    return this.users;
  }

  getUser(userId) {
    return this.users.find(u => u.id === userId) || null;
  }

  createUser(userData) {
    const newId = "usr_" + Date.now();
    const defaultPerms = this.getDefaultPermissions(userData.role);

    const newUser = {
      id: newId,
      name: userData.name || "Novo Utilizador",
      email: (userData.email || "").trim().toLowerCase(),
      username: (userData.username || (userData.email ? userData.email.split("@")[0] : "user" + Math.floor(Math.random() * 1000))).toLowerCase(),
      password: userData.password || "123456",
      role: userData.role || "teacher", // admin | teacher | student
      title: userData.title || (userData.role === "admin" ? "Administrador" : (userData.role === "teacher" ? "Professor do 1º Ciclo" : "Aluno")),
      avatar: userData.avatar || (userData.role === "admin" ? "👨‍💼" : (userData.role === "teacher" ? "👩‍🏫" : "👦")),
      status: "active",
      createdAt: new Date().toISOString().split("T")[0],
      permissions: Object.assign({}, defaultPerms, userData.permissions || {})
    };

    // Validação de unicidade de email/username
    const exists = this.users.some(u => u.email === newUser.email || u.username === newUser.username);
    if (exists) {
      return { success: false, message: "Já existe uma conta com esse email ou nome de utilizador." };
    }

    this.users.push(newUser);
    this._saveUsers(this.users);
    return { success: true, user: newUser };
  }

  updateUser(userId, data) {
    const idx = this.users.findIndex(u => u.id === userId);
    if (idx === -1) return { success: false, message: "Utilizador não encontrado." };

    // Impede alterar o papel do admin principal
    if (this.users[idx].id === "usr_admin_1" && data.role && data.role !== "admin") {
      return { success: false, message: "O administrador principal não pode perder privilégios." };
    }

    this.users[idx] = Object.assign({}, this.users[idx], data);
    this._saveUsers(this.users);

    // Se o próprio utilizador logado foi atualizado
    if (this.currentUser && this.currentUser.id === userId) {
      this.currentUser = this.users[idx];
      localStorage.setItem(this.storageKeySession, JSON.stringify(this.currentUser));
    }

    return { success: true, user: this.users[idx] };
  }

  setUserPassword(userId, newPassword) {
    const user = this.users.find(u => u.id === userId);
    if (!user) return { success: false, message: "Utilizador não encontrado." };

    if (!newPassword || newPassword.trim().length === 0) {
      return { success: false, message: "A palavra-passe não pode estar vazia." };
    }

    user.password = newPassword.trim();
    this._saveUsers(this.users);

    if (this.currentUser && this.currentUser.id === userId) {
      this.currentUser.password = user.password;
      try {
        localStorage.setItem(this.storageKeySession, JSON.stringify(this.currentUser));
      } catch (e) {}
    }

    return { success: true, message: `Palavra-passe de ${user.name} atualizada com sucesso para "${user.password}".` };
  }

  toggleUserStatus(userId) {
    const user = this.users.find(u => u.id === userId);
    if (!user) return { success: false, message: "Utilizador não encontrado." };

    if (user.id === "usr_admin_1") {
      return { success: false, message: "Não é possível bloquear o Administrador Principal." };
    }

    user.status = user.status === "active" ? "blocked" : "active";
    this._saveUsers(this.users);

    // Se o utilizador bloqueado for o logado
    if (this.currentUser && this.currentUser.id === userId && user.status === "blocked") {
      this.logout();
    }

    return { 
      success: true, 
      status: user.status,
      message: user.status === "active" ? `Conta de ${user.name} desbloqueada.` : `Conta de ${user.name} bloqueada.` 
    };
  }

  deleteUser(userId) {
    if (userId === "usr_admin_1") {
      return { success: false, message: "Não é permitido eliminar o Administrador Principal." };
    }

    const user = this.users.find(u => u.id === userId);
    const userName = user ? user.name : "Utilizador";

    this.users = this.users.filter(u => u.id !== userId);
    this._saveUsers(this.users);

    if (this.currentUser && this.currentUser.id === userId) {
      this.logout();
    }

    return { success: true, message: `Utilizador "${userName}" eliminado do sistema.` };
  }

  resetToDefaults() {
    this.users = JSON.parse(JSON.stringify(DEFAULT_USERS_DATA));
    this._saveUsers(this.users);
    return { success: true };
  }

  getDefaultPermissions(role) {
    if (role === "admin") {
      return {
        teacher_generator: true,
        student_mode: true,
        study_support: true,
        ai_settings: true,
        admin_panel: true,
        view_solutions: true,
        export_sheets: true
      };
    }
    if (role === "teacher") {
      return {
        teacher_generator: true,
        student_mode: true,
        study_support: true,
        ai_settings: false,
        admin_panel: false,
        view_solutions: true,
        export_sheets: true
      };
    }
    // student
    return {
      teacher_generator: false,
      student_mode: true,
      study_support: true,
      ai_settings: false,
      admin_panel: false,
      view_solutions: false,
      export_sheets: false
    };
  }
}

  _bindEvents() {
    // Alternar entre Iniciar Sessão e Aderir / Criar Conta
    const tabLogin = this.container.querySelector("#tab-login");
    const tabRegister = this.container.querySelector("#tab-register");
    const linkToRegister = this.container.querySelector("#link-to-register");
    const linkToLogin = this.container.querySelector("#link-to-login");

    if (tabLogin) {
      tabLogin.addEventListener("click", () => {
        this.isRegisterMode = false;
        this.errorMessage = "";
        this.successMessage = "";
        this.notFoundData = null;
        this.render();
      });
    }

    if (tabRegister) {
      tabRegister.addEventListener("click", () => {
        this.isRegisterMode = true;
        this.errorMessage = "";
        this.successMessage = "";
        this.notFoundData = null;
        this.render();
      });
    }

    if (linkToRegister) {
      linkToRegister.addEventListener("click", () => {
        this.isRegisterMode = true;
        this.errorMessage = "";
        this.successMessage = "";
        this.notFoundData = null;
        this.render();
      });
    }

    if (linkToLogin) {
      linkToLogin.addEventListener("click", () => {
        this.isRegisterMode = false;
        this.errorMessage = "";
        this.successMessage = "";
        this.notFoundData = null;
        this.render();
      });
    }

    const togglePassBtn = this.container.querySelector("#btn-toggle-password");
    if (togglePassBtn) {
      togglePassBtn.addEventListener("click", () => {
        this.showPassword = !this.showPassword;
        this.render();
      });
    }

    // Formulário de Login Tradicional
    const formLogin = this.container.querySelector("#form-login");
    if (formLogin) {
      formLogin.addEventListener("submit", (e) => {
        e.preventDefault();
        const id = (this.container.querySelector("#input-login-id")?.value || "").trim();
        const pass = this.container.querySelector("#input-login-pass")?.value || "";

        const res = authManager.login(id, pass);
        if (res.success) {
          if (this.onLoginSuccess) this.onLoginSuccess(res.user);
        } else if (res.notFound) {
          // Utilizador não encontrado neste computador: ativa resgate com 1 clique!
          this.notFoundData = { id, pass };
          this.errorMessage = "";
          soundEffects.playEncourage();
          this.render();
        } else {
          this.notFoundData = null;
          this.errorMessage = res.message;
          soundEffects.playEncourage();
          this.render();
        }
      });
    }

    // Botões de Resgate: Criar e Entrar num só clique se não existir neste computador
    const btnQuickTeacher = this.container.querySelector("#btn-quick-create-teacher");
    const btnQuickStudent = this.container.querySelector("#btn-quick-create-student");

    if (btnQuickTeacher && this.notFoundData) {
      btnQuickTeacher.addEventListener("click", () => {
        const rawId = this.notFoundData.id;
        const cleanUsername = rawId.includes("@") ? rawId.split("@")[0] : rawId;
        const displayName = cleanUsername.charAt(0).toUpperCase() + cleanUsername.slice(1);
        const email = rawId.includes("@") ? rawId : `${cleanUsername}@escola.pt`;

        const res = authManager.createUser({
          name: `Prof. ${displayName}`,
          username: cleanUsername,
          email: email,
          password: this.notFoundData.pass,
          role: "teacher",
          avatar: "👩‍🏫",
          title: "Professor(a) do 1º Ciclo"
        });

        if (res.success) {
          const loginRes = authManager.login(cleanUsername, this.notFoundData.pass);
          if (loginRes.success) {
            soundEffects.playSuccess();
            if (this.onLoginSuccess) this.onLoginSuccess(loginRes.user);
          }
        } else {
          this.errorMessage = res.message;
          this.render();
        }
      });
    }

    if (btnQuickStudent && this.notFoundData) {
      btnQuickStudent.addEventListener("click", () => {
        const rawId = this.notFoundData.id;
        const cleanUsername = rawId.includes("@") ? rawId.split("@")[0] : rawId;
        const displayName = cleanUsername.charAt(0).toUpperCase() + cleanUsername.slice(1);
        const email = rawId.includes("@") ? rawId : `${cleanUsername}@escola.pt`;

        const res = authManager.createUser({
          name: displayName,
          username: cleanUsername,
          email: email,
          password: this.notFoundData.pass,
          role: "student",
          avatar: "👦",
          title: "Aluno(a)"
        });

        if (res.success) {
          const loginRes = authManager.login(cleanUsername, this.notFoundData.pass);
          if (loginRes.success) {
            soundEffects.playSuccess();
            if (this.onLoginSuccess) this.onLoginSuccess(loginRes.user);
          }
        } else {
          this.errorMessage = res.message;
          this.render();
        }
      });
    }

    // Formulário de Registo / Aderir
    const formRegister = this.container.querySelector("#form-register");
    if (formRegister) {
      formRegister.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = (this.container.querySelector("#reg-name")?.value || "").trim();
        const username = (this.container.querySelector("#reg-username")?.value || "").trim().toLowerCase();
        const email = (this.container.querySelector("#reg-email")?.value || "").trim().toLowerCase();
        const pass = this.container.querySelector("#reg-pass")?.value || "";
        const role = this.container.querySelector('input[name="reg-role"]:checked')?.value || "teacher";

        if (!name || !username || !pass) {
          this.errorMessage = "Por favor, preenche todos os campos obrigatórios (*).";
          this.render();
          return;
        }

        if (username.length < 3) {
          this.errorMessage = "O nome de utilizador deve ter pelo menos 3 carateres.";
          this.render();
          return;
        }

        const res = authManager.createUser({
          name,
          username,
          email: email || `${username}@escola.pt`,
          password: pass,
          role,
          avatar: role === "admin" ? "👨‍💼" : (role === "teacher" ? "👩‍🏫" : "👦"),
          title: role === "admin" ? "Diretor / Administrador" : (role === "teacher" ? "Professor(a) do 1º Ciclo" : "Aluno(a)")
        });

        if (res.success) {
          const loginRes = authManager.login(username, pass);
          if (loginRes.success) {
            soundEffects.playSuccess();
            if (this.onLoginSuccess) this.onLoginSuccess(loginRes.user);
          } else {
            this.isRegisterMode = false;
            this.errorMessage = "";
            this.successMessage = "Conta criada com sucesso! Podes agora iniciar sessão.";
            this.render();
          }
        } else {
          this.errorMessage = res.message;
          soundEffects.playEncourage();
          this.render();
        }
      });

      // Alternar estilização dos cartões de perfil (Professor vs Aluno vs Direção)
      const roleRadios = this.container.querySelectorAll('input[name="reg-role"]');
      roleRadios.forEach(radio => {
        radio.addEventListener("change", () => {
          const lblTeacher = this.container.querySelector("#label-role-teacher");
          const lblStudent = this.container.querySelector("#label-role-student");
          const lblAdmin = this.container.querySelector("#label-role-admin");
          const activeClass = "cursor-pointer border-2 rounded-2xl p-2.5 flex flex-col items-center gap-1 transition text-center bg-indigo-50/60 border-indigo-500 shadow-sm";
          const inactiveClass = "cursor-pointer border-2 rounded-2xl p-2.5 flex flex-col items-center gap-1 transition text-center bg-slate-50 border-slate-200 hover:border-slate-300";

          if (lblTeacher) lblTeacher.className = radio.value === "teacher" && radio.checked ? activeClass : inactiveClass;
          if (lblStudent) lblStudent.className = radio.value === "student" && radio.checked ? activeClass : inactiveClass;
          if (lblAdmin) lblAdmin.className = radio.value === "admin" && radio.checked ? activeClass : inactiveClass;
        });
      });
    }
  }
}

  _renderPermissionsModal(user) {

          <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">

              <label class="block text-xs font-black uppercase tracking-wider mb-2 ${user.status === "active" ? "text-emerald-950" : "text-red-950"} flex items-center justify-between">
                <span>Controlo de Bloqueio de Conta:</span>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full ${user.status === "active" ? "bg-emerald-200 text-emerald-900" : "bg-red-200 text-red-900"}">

              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer font-bold text-xs ${user.status === "active" ? "bg-white border-emerald-400 shadow-sm text-emerald-900" : "bg-transparent border-slate-200 text-slate-600"}">
                  <input type="radio" name="modal-user-status" value="active" ${user.status === "active" ? "checked" : ""} class="text-emerald-600 accent-emerald-600">
                  <span>🔓 Desbloqueado (Ativo)</span>
                </label>
                <label class="flex items-center gap-2 p-2.5 rounded-xl border cursor-pointer font-bold text-xs ${user.id === 'usr_admin_1' ? 'opacity-40 cursor-not-allowed' : (user.status === 'blocked' ? 'bg-white border-red-400 shadow-sm text-red-900' : 'bg-transparent border-slate-200 text-slate-600')}">
                  <input type="radio" name="modal-user-status" value="blocked" ${user.status === "blocked" ? "checked" : ""} ${user.id === 'usr_admin_1' ? 'disabled' : ''} class="text-red-600 accent-red-600">

              </div>

                  </span>

                    <span>Ver Soluções e Resoluções</span>

                  <span>Eliminar Utilizador</span>

              <div class="flex gap-2">

              </div>

        </div>
