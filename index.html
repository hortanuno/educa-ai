  // =========================================================================
  // GESTÃO DO TEMPORIZADOR POMODORO
  // =========================================================================
  _startPomodoroTimer() {
    if (this.pomodoro.isRunning) return;

    this.pomodoro.isRunning = true;
    soundEffects.playPomodoroStart();

    if (this.pomodoro.isBreak) {
      sofiaVoice.speak("Boa! Agora descansa 5 minutos. Bebe água fresca e estica os braços!");
    } else {
      sofiaVoice.speak(`Foco total durante ${this.pomodoro.initialMinutes} minutos! Tu consegues!`);
    }

    this.pomodoro.intervalId = setInterval(() => {
      if (this.pomodoro.seconds > 0) {
        this.pomodoro.seconds--;
      } else if (this.pomodoro.minutes > 0) {
        this.pomodoro.minutes--;
        this.pomodoro.seconds = 59;
      } else {
        // Pomodoro Concluído!
        this._completePomodoroSession();
      }
      this.render();
    }, 1000);

    this.render();
  }

  _pausePomodoroTimer() {
    this._stopPomodoroTimer();
    soundEffects.playEncourage();
    this.render();
  }

  _stopPomodoroTimer() {
    if (this.pomodoro.intervalId) {
      clearInterval(this.pomodoro.intervalId);
      this.pomodoro.intervalId = null;
    }
    this.pomodoro.isRunning = false;
  }

  _resetPomodoroTimer() {
    this._stopPomodoroTimer();
    this.pomodoro.minutes = this.pomodoro.initialMinutes;
    this.pomodoro.seconds = 0;
    this.render();
  }

  _completePomodoroSession() {
    this._stopPomodoroTimer();
    soundEffects.playPomodoroComplete();

    if (!this.pomodoro.isBreak) {
      this.pomodoro.sessionsCompleted++;
      localStorage.setItem("sofia_pomodoro_sessions", this.pomodoro.sessionsCompleted.toString());
      
      if (typeof confetti === "function") {
        confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
      }

      sofiaVoice.speak("Fantástico! Concluíste a tua sessão de estudo com nota dez! Agora mereces 5 minutos de pausa para beber água!");
      this.pomodoro.isBreak = true;
      this.pomodoro.minutes = 5;
      this.pomodoro.seconds = 0;
      this.pomodoro.initialMinutes = 5;
    } else {
      sofiaVoice.speak("Pausa concluída! Estás pronto para mais um momento de aprendizagem?");
      this.pomodoro.isBreak = false;
      this.pomodoro.minutes = 15;
      this.pomodoro.seconds = 0;
      this.pomodoro.initialMinutes = 15;
    }
  }

  // =========================================================================
  // MOTOR DE RESPOSTA INTELIGENTE DO TUTOR
  // =========================================================================
  _generateSmartAnswer(query) {
    const q = query.toLowerCase();

    if (q.includes("tabuada") || q.includes("vezes") || q.includes("multiplic")) {
      return "Para saberes as tabuadas com facilidade, lembra-te que a multiplicação é apenas somar o mesmo número várias vezes! A do 5 termina sempre em 0 ou 5, e a do 10 termina sempre em 0.";
    }
    if (q.includes("soma") || q.includes("adição") || q.includes("mais")) {
      return "Na adição somamos e juntamos parcelas para encontrar o total de tudo junto. Alinha sempre as unidades por baixo de unidades!";
    }
    if (q.includes("subtra") || q.includes("menos") || q.includes("diferença")) {
      return "Na subtração tiramos uma quantidade de outra para saber quanto sobra ou qual é a diferença entre as duas. O número de cima deve ser maior!";
    }
    if (q.includes("nome próprio") || q.includes("maiúscul")) {
      return "Os Nomes Próprios escrevem-se SEMPRE com letra maiúscula no início, porque identificam pessoas específicas (como Beatriz), cidades (como Lisboa) ou países (como Portugal).";
    }
    if (q.includes("água") || q.includes("evapora") || q.includes("chuva")) {
      return "A água na natureza faz uma viagem mágica chamada Ciclo da Água: com o calor do Sol ela evapora, forma as nuvens no céu e depois cai em forma de chuva para encher os rios!";
    }
    if (q.includes("ecoponto") || q.includes("lixo") || q.includes("recicl")) {
      return "Separar o lixo é super fácil: no Amarelo vão os plásticos e latas; no Azul vai o papel e cartão limpo; no Verde vão as garrafas e frascos de vidro!";
    }
    if (q.includes("portugal") || q.includes("afonso") || q.includes("rei")) {
      return "D. Afonso Henriques foi o primeiro rei de Portugal e assinou o Tratado de Zamora em 1143. É por isso que 1143 é o ano de nascimento do nosso país!";
    }
    if (q.includes("inglês") || q.includes("english") || q.includes("hello")) {
      return "Em inglês para ser educado usa sempre 'Please' (por favor) e 'Thank you' (obrigado). Pratica a dizer as cores e os números todos os dias em voz alta!";
    }

    return `Que pergunta tão interessante sobre "${query}"! Pensa no que aprendeste nas aulas e procura nos nossos cartões de estudo. Se explicares a matéria com as tuas palavras, o teu cérebro vai guardar para sempre!`;
  }
}

  _getAppIcon() {
    return (typeof window !== "undefined" && window.APP_ICON_DATA_URL)

  }

  init() {
    this.render();
  }

  /**
   * Garante numeração sequencial (1..N) e equilíbrio de pontos para 100%
   */
  _normalizeExercises() {
    if (!this.currentSheet || !this.currentSheet.exercises) return;
    const count = this.currentSheet.exercises.length;
    if (count === 0) return;

    const basePoints = Math.floor(100 / count);
    const remainder = 100 - (basePoints * count);

    this.currentSheet.exercises.forEach((ex, idx) => {
      ex.number = idx + 1;
      ex.id = `ex${idx + 1}`;
      ex.points = idx === 0 ? basePoints + remainder : basePoints;
    });

    this.exerciseCount = count;
  }

  _getPageEstimateText(count) {
    if (count <= 3) return "Estimativa: ~1 Página A4";
    if (count <= 7) return "Estimativa: ~2 Páginas A4 (Frente e Verso)";
    if (count <= 12) return "Estimativa: ~3 Páginas A4";
    return "Estimativa: ~4 a 5 Páginas A4 (Caderno de Prova Completo)";
  }

  _loadSavedImages() {
    try {
      const stored = localStorage.getItem("educa_ai_images");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {
      console.warn("Erro ao carregar imagens guardadas:", e);
    }
    const presets = (typeof window !== "undefined" && window.DEFAULT_IMAGE_PRESETS)
      ? window.DEFAULT_IMAGE_PRESETS
      : (typeof DEFAULT_IMAGE_PRESETS !== "undefined" ? DEFAULT_IMAGE_PRESETS : []);
    return JSON.parse(JSON.stringify(presets));
  }

    try {

    } catch (e) {

                  <span class="w-3 h-3 rounded-full bg-red-400"></span>
                  <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                  <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
                  <span class="ml-1 text-slate-800 font-black hidden sm:inline">Modelo Oficial:</span>
                  <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                    <button type="button" class="btn-quick-type w-28 h-8 rounded-lg text-xs font-black transition flex items-center justify-center ${this.selectedType === "trimestral" ? "bg-blue-600 text-white shadow-sm" : "text-slate-700 hover:bg-white"}" data-type="trimestral" title="Ficha de Avaliação Trimestral">
                      Trimestral
                    </button>
                    <button type="button" class="btn-quick-type w-28 h-8 rounded-lg text-xs font-black transition flex items-center justify-center ${this.selectedType === "intercalar" ? "bg-blue-600 text-white shadow-sm" : "text-slate-700 hover:bg-white"}" data-type="intercalar" title="Questão de Aula - Avaliação Intercalar">
                      Intercalar
                    </button>
                    <button type="button" class="btn-quick-type w-28 h-8 rounded-lg text-xs font-black transition flex items-center justify-center ${this.selectedType === "diagnostica" ? "bg-blue-600 text-white shadow-sm" : "text-slate-700 hover:bg-white"}" data-type="diagnostica" title="Ficha de Avaliação Diagnóstica">
                      Diagnóstica
                    </button>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button id="btn-scroll-to-images" type="button" class="h-8 px-3 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-lg flex items-center justify-center gap-1.5 font-black text-xs transition" title="Ir para a Caixa de Imagens (Upload / Arraste / Download)">
                    <span>🖼️</span> <span class="hidden sm:inline">Imagens</span> (${this.uploadedImages.length})
                  </button>
                  <button id="btn-quick-print" class="h-8 px-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center justify-center gap-1.5 font-black text-xs shadow-sm transition">
                    <span>🖨️</span> Imprimir Prova
                  </button>
                </div>
              </div>

              <!-- Contentor da Folha A4 Imprimível -->
              <div id="worksheet-printable-area" class="w-full max-w-[210mm] bg-white shadow-2xl border border-slate-200 p-8 sm:p-12 print-page ${this.currentSheet.level === "apoio" ? "font-accessible" : ""}">
                ${this._renderWorksheetHTML(this.currentSheet)}
              </div>

              <!-- Folha de Soluções para o Professor (Página Separada) -->
              ${this.showSolutions ? `
                <div id="solutions-printable-area" class="w-full max-w-[210mm] bg-white shadow-2xl border border-slate-200 p-8 sm:p-12 print-page mt-8 page-break-before">
                  ${this._renderSolutionsHTML(this.currentSheet)}
                </div>
              ` : ""}

            </section>

          </div>
        </main>
      </div>

      <!-- Contentor para o Modo Aluno (quando ativado) -->
      <div id="student-mode-container" class="hidden min-h-screen bg-gradient-to-b from-amber-50 to-purple-50"></div>
    `;

    this._bindEvents();
  }

  _getSubjectEmoji(subjectId) {
    switch (subjectId) {
      case "portugues": return "📖";
      case "matematica": return "🔢";
      case "estudo-meio": return "🌍";
      case "ingles": return "🇬🇧";
      case "cidadania": return "🤝";
      case "emrc": return "🕊️";
      default: return "📝";
    }
  }

  _getDomainsOptions() {
    const subjectObj = CURRICULUM_PT.subjects.find(s => s.id === this.selectedSubject);
    const domains = subjectObj?.domainsByYear[this.selectedYear] || [];
    return domains.map(d => `
      <option value="${d.id}" ${this.selectedDomain === d.id ? "selected" : ""}>${d.name}</option>
    `).join("");
  }

  _renderOfficialSchoolHeader(sheet) {
    const schoolLogo = this.customSchoolLogo
      || ((typeof window !== "undefined" && window.SCHOOL_LOGO_B64) 
        ? window.SCHOOL_LOGO_B64 
        : (typeof SCHOOL_LOGO_B64 !== "undefined" ? SCHOOL_LOGO_B64 : ""));

    // Deteta professor autenticado
    const currentUser = (typeof window !== "undefined" && window.authManager)
      ? window.authManager.getCurrentUser()
      : (typeof authManager !== "undefined" ? authManager.getCurrentUser() : null);

    let currentTeacherName = "Maria Santos";
    if (currentUser && currentUser.name) {
      currentTeacherName = currentUser.name;
    } else if (sheet.schoolHeader?.teacherName) {
      currentTeacherName = sheet.schoolHeader.teacherName;
    }

    // Tipo de ficha: trimestral, intercalar, diagnostica
    const currentType = this.selectedType || sheet.type || "trimestral";
    
    // Título oficial da ficha e identificador de tipo
    let headerTitle = "FICHA DE AVALIAÇÃO TRIMESTRAL";
    let isDiagnostica = false;

    if (currentType === "diagnostica") {
      headerTitle = "FICHA DE AVALIAÇÃO DIAGNÓSTICA";
      isDiagnostica = true;
    } else if (currentType === "intercalar") {
      headerTitle = "QUESTÃO DE AULA - Avaliação Intercalar";
    } else {
      headerTitle = "FICHA DE AVALIAÇÃO TRIMESTRAL";
    }

    // Disciplina em maiúsculas
    const subjectMap = {
      "matematica": "MATEMÁTICA",
      "portugues": "PORTUGUÊS",
      "estudo-meio": "ESTUDO DO MEIO",
      "ingles": "INGLÊS",
      "cidadania": "CIDADANIA",
      "emrc": "EMRC"
    };
    const subjectName = subjectMap[sheet.subject || this.selectedSubject] || (sheet.subject?.toUpperCase() || "MATEMÁTICA");

    // Ano e Período
    const sheetYear = sheet.year || this.selectedYear || 1;
    const periodNumber = this.selectedPeriod || sheet.period || 1;

    return `
      <!-- Cabeçalho Oficial Idêntico ao Agrupamento de Escolas Mouzinho da Silveira (Baixa da Banheira) -->
      <div class="school-header-official border-[1.5px] border-black bg-white text-black p-0 mb-6 font-sans text-xs" style="display: flex !important; width: 100%; box-sizing: border-box; min-height: 175px;">
        
        <!-- COLUNA ESQUERDA (Exatamente 72% de largura, retângulo esquerdo) -->
        <div class="school-header-left p-3 sm:p-4 flex flex-col justify-between" style="flex: 0 0 72% !important; width: 72% !important; border-right: 1.5px solid #000 !important; box-sizing: border-box !important;">
          
          <!-- Linha Superior: Logótipo à esquerda | Disciplina, Ano-Período e Ano Letivo à direita -->
          <div class="flex items-start justify-between gap-3">
            <!-- Logótipo Oficial Mouzinho da Silveira -->
            <div class="flex items-center">
              ${schoolLogo ? `
                <img src="${schoolLogo}" alt="Agrupamento de Escolas Mouzinho da Silveira — Baixa da Banheira" class="h-12 sm:h-14 w-auto object-contain max-w-[280px]" />
              ` : `
                <div class="font-black text-xs uppercase text-black">
                  Agrupamento de Escolas Mouzinho da Silveira
                </div>
              `}
            </div>

            <!-- Metadados da Disciplina e Período (alinhados à direita) -->
            <div class="text-right leading-tight">
              <div class="font-black text-sm uppercase tracking-wide text-black">${subjectName}</div>
              <div class="font-bold text-xs uppercase text-black mt-0.5">${sheetYear}.º ANO - ${periodNumber}.º PERÍODO</div>
              <div class="font-bold text-xs text-black mt-0.5">2026/2027</div>
            </div>
          </div>

          <!-- Título Centrado Oficial da Ficha -->
          <div class="text-center my-2 sm:my-3">
            <div class="font-black text-sm sm:text-base uppercase tracking-wider text-black">
              ${headerTitle}
            </div>
          </div>

          <!-- Campos Oficiais de Identificação com Linhas Contínuas Pretas -->
          <div class="space-y-2 text-xs font-bold text-black">
            <!-- Linha 1: Nome -->
            <div class="flex items-end gap-1.5">
              <span class="whitespace-nowrap">Nome:</span>
              <span class="flex-1 border-b border-black min-h-[16px]"></span>
            </div>

            <!-- Linha 2: N.º, Turma, Data -->
            <div class="flex items-end justify-between gap-2 pt-0.5">
              <div class="flex items-end gap-1.5 w-24">
                <span class="whitespace-nowrap">N.º:</span>
                <span class="flex-1 border-b border-black min-h-[16px]"></span>
              </div>
              <div class="flex items-end gap-1.5 w-32">
                <span class="whitespace-nowrap">Turma:</span>
                <span class="flex-1 border-b border-black min-h-[16px]"></span>
              </div>
              <div class="flex items-end gap-1.5 flex-1 max-w-[230px]">
                <span class="whitespace-nowrap">Data:</span>
                <span class="flex-1 border-b border-black min-h-[16px]"></span>
                <span class="text-black font-normal">/</span>
                <span class="flex-1 border-b border-black min-h-[16px]"></span>
                <span class="text-black font-normal">/</span>
                <span class="w-14 border-b border-black min-h-[16px]"></span>
              </div>
            </div>

            <!-- Linha 3: Prof.ª e Enc. Edu. -->
            <div class="flex items-end justify-between gap-4 pt-0.5">
              <div class="flex items-end gap-1.5 flex-1">
                <span class="whitespace-nowrap">Prof.ª:</span>
                <span contenteditable="true" class="flex-1 border-b border-black font-black text-black px-1 min-h-[16px] outline-none focus:bg-amber-50" title="Clica para editar o nome se necessário">
                  ${currentTeacherName}
                </span>
              </div>
              <div class="flex items-end gap-1.5 flex-1">
                <span class="whitespace-nowrap">Enc. Edu.:</span>
                <span class="flex-1 border-b border-black min-h-[16px]"></span>
              </div>
            </div>
          </div>

        </div>

        <!-- COLUNA DIREITA (Exatamente 28% de largura, retângulo direito) -->
        <div class="school-header-right p-3 text-black flex flex-col justify-between" style="flex: 0 0 28% !important; width: 28% !important; box-sizing: border-box !important;">
          ${isDiagnostica ? `
            <!-- Modelo 3: Apreciação / Observações (Ficha Diagnóstica) -->
            <div class="flex flex-col h-full justify-between">
              <div class="font-black text-xs sm:text-[13px] uppercase text-center border-b border-black pb-2 tracking-tight">
                APRECIAÇÃO / OBSERVAÇÕES
              </div>
              <div class="flex-1 min-h-[110px] sm:min-h-[125px] p-1 text-[11px] text-slate-400 italic">
                <!-- Espaço em branco reservado para anotações do professor -->
              </div>
            </div>
          ` : `
            <!-- Modelos 1 e 2: Classificação com Níveis Percentuais (Trimestral e Intercalar) -->
            <div class="flex flex-col h-full justify-between">
              <div class="font-black text-xs sm:text-[13px] uppercase text-center border-b border-black pb-2 tracking-tight">
                CLASSIFICAÇÃO
              </div>
              <div class="flex-1 flex flex-col justify-around py-2 space-y-2 text-xs font-bold">
                <div class="flex items-end justify-between">
                  <span>Insuficiente</span>
                  <span class="w-16 border-b border-black text-right pr-0.5 font-normal text-slate-700">%</span>
                </div>
                <div class="flex items-end justify-between">
                  <span>Suficiente</span>
                  <span class="w-16 border-b border-black text-right pr-0.5 font-normal text-slate-700">%</span>
                </div>
                <div class="flex items-end justify-between">
                  <span>Bom</span>
                  <span class="w-16 border-b border-black text-right pr-0.5 font-normal text-slate-700">%</span>
                </div>
                <div class="flex items-end justify-between">
                  <span>Muito Bom</span>
                  <span class="w-16 border-b border-black text-right pr-0.5 font-normal text-slate-700">%</span>
                </div>
              </div>
            </div>
          `}
        </div>

      </div>
    `;
  }

  _renderWorksheetHTML(sheet) {
    const isApoio = sheet.level === "apoio";

    return `
      <div class="worksheet-container text-slate-900 leading-relaxed">
        
        <!-- Cabeçalho Oficial Escolar dos 3 Modelos -->
        ${this._renderOfficialSchoolHeader(sheet)}

        <!-- Lista de Exercícios (Suporta de 1 a 20 exercícios) -->
        <div class="space-y-6">
          ${sheet.exercises.map((ex, idx) => this._renderSingleExercisePrintHTML(ex, idx, isApoio)).join("")}
        </div>

        <!-- Barra do Professor: Adicionar Pergunta (Oculta na Impressão) -->
        <div class="no-print mt-8 pt-4 border-t border-dashed border-slate-300 text-center">
          <button id="btn-add-quick-exercise" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border-2 border-dashed border-blue-400 font-black py-3 px-8 rounded-2xl text-xs transition flex items-center gap-2 mx-auto shadow-sm">
            <span>➕</span>
            <span>Adicionar Pergunta à Prova (${sheet.exercises.length + 1}ª de até 20)</span>
          </button>
        </div>

      </div>
    `;
  }

  _renderSingleExercisePrintHTML(ex, idx, isApoio) {
    return `
      <div class="exercise-item border border-slate-200 rounded-xl p-4 sm:p-5 bg-white relative group transition-all" data-exercise-index="${idx}">
        <div class="flex items-start justify-between gap-4 mb-3">
          <div class="flex items-start gap-2.5 flex-1">
            <span class="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black text-sm flex-shrink-0">
              ${ex.number}
            </span>
            <div contenteditable="true" class="font-bold text-sm text-slate-800 outline-none focus:bg-amber-50 rounded flex-1">
              ${ex.prompt}
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-shrink-0">
            <!-- Botão Adicionar Imagem a esta pergunta (no-print) -->
            <button type="button" class="btn-trigger-ex-image no-print text-slate-400 hover:text-purple-600 p-1.5 rounded-lg hover:bg-purple-50 transition text-xs font-bold flex items-center gap-1" data-index="${idx}" title="Adicionar ou alterar imagem desta pergunta">
              <span>🖼️</span>
              <span class="hidden sm:inline text-[10px]">Imagem</span>
            </button>
            <!-- Botão Eliminar Pergunta (no-print) -->
            <button class="btn-delete-exercise no-print text-slate-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition text-xs" data-index="${idx}" title="Eliminar pergunta ${ex.number}">
              🗑️
            </button>
          </div>
        </div>

        ${ex.visualAid ? `
          <div class="text-center text-3xl my-3 tracking-widest bg-slate-50 p-3 rounded-lg border border-slate-100 select-none">
            ${ex.visualAid}
          </div>
        ` : ""}

        <!-- Imagem / Ilustração do Exercício (se configurada) -->
        ${ex.image ? `
          <div class="my-3 text-center relative group/img inline-block w-full">
            <div class="inline-block relative">
              <img src="${ex.image}" alt="Ilustração da pergunta ${ex.number}" class="max-h-52 max-w-full mx-auto rounded-xl border border-slate-200 object-contain shadow-xs bg-white" style="${ex.imageSize ? `max-height: ${ex.imageSize}px;` : ''}" />
              <div class="no-print absolute top-2 right-2 flex items-center gap-1 opacity-0 group-hover/img:opacity-100 transition-opacity bg-white/95 backdrop-blur-sm p-1 rounded-lg shadow-md border border-slate-200">
                <button type="button" class="btn-toggle-img-size text-slate-600 hover:text-blue-600 px-2 py-0.5 text-[10px] font-black rounded hover:bg-slate-100 transition" data-index="${idx}" title="Alternar tamanho (Pequeno / Médio / Grande)">
                  🔍 Tamanho
                </button>
                <button type="button" class="btn-remove-ex-image text-slate-600 hover:text-red-600 px-2 py-0.5 text-[10px] font-black rounded hover:bg-red-50 transition" data-index="${idx}" title="Remover imagem desta pergunta">
                  ✕ Remover
                </button>
              </div>
            </div>
          </div>
        ` : `
          <!-- Zona de Arraste Rápido Direto na Pergunta (Oculta na Impressão) -->
          <div class="no-print dropzone-single-ex border-2 border-dashed border-slate-200 hover:border-purple-400 hover:bg-purple-50/40 rounded-xl p-2.5 my-2.5 text-center text-slate-400 hover:text-purple-700 transition cursor-pointer flex items-center justify-center gap-2 text-xs" data-index="${idx}" title="Arrasta uma imagem para aqui ou clica para ilustrar esta pergunta">
            <span class="text-sm">📥</span>
            <span class="text-[11px] font-bold">Arrasta uma imagem para aqui ou clica para ilustrar a Pergunta ${ex.number}</span>
          </div>
        `}

        <!-- Renderização específica por formato -->
        ${this._renderExercisePrintBody(ex, isApoio)}
      </div>
    `;
  }

  _renderExercisePrintBody(ex, isApoio) {
    if (ex.type === "multiple-choice") {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
          ${ex.options.map((opt, i) => `
            <div class="flex items-center gap-3 p-2.5 border border-slate-300 rounded-lg bg-slate-50/50">
              <span class="w-5 h-5 rounded-full border-2 border-slate-400 flex items-center justify-center flex-shrink-0"></span>
              <span contenteditable="true" class="text-xs font-medium text-slate-800 outline-none">${opt.text}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    if (ex.type === "match-columns") {
      return `
        <div class="grid grid-cols-2 gap-8 my-4 px-4">
          <div class="space-y-4">
            ${ex.left.map(item => `
              <div class="flex items-center justify-between border-b border-slate-200 pb-1">
                <span contenteditable="true" class="text-xs font-bold text-slate-800 outline-none">${item.label}</span>
                <span class="w-3.5 h-3.5 rounded-full bg-slate-700 ml-2"></span>
              </div>
            `).join("")}
          </div>
          <div class="space-y-4">
            ${ex.right.map(item => `
              <div class="flex items-center justify-between border-b border-slate-200 pb-1">
                <span class="w-3.5 h-3.5 rounded-full border-2 border-slate-700 mr-2"></span>
                <span contenteditable="true" class="text-xs font-bold text-slate-800 outline-none">${item.label}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    if (ex.type === "math-grid") {
      return `
        <div class="flex flex-wrap justify-around gap-6 my-4">
          ${ex.operations.map(op => `
            <div class="math-operation-box">
              <div class="math-op-header">
                <span>C</span><span>D</span><span>U</span>
              </div>
              <div class="math-op-row text-right">${op.num1}</div>
              <div class="math-op-row">
                <span class="text-slate-600">${op.operator}</span>
                <span>${op.num2}</span>
              </div>
              <div class="math-op-bar"></div>
              <div class="math-op-result-space"></div>
            </div>
          `).join("")}
        </div>
      `;
    }

    if (ex.type === "word-search") {
      return `
        <div class="flex flex-col sm:flex-row items-center justify-center gap-8 my-4">
          <div class="word-search-grid">
            ${ex.grid.map(row => `
              <div class="flex gap-1">
                ${row.map(cell => `<span class="word-search-cell">${cell}</span>`).join("")}
              </div>
            `).join("")}
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
            <div class="font-bold uppercase text-slate-600 mb-2">Palavras a encontrar:</div>
            <ul class="space-y-1 font-mono font-bold text-slate-800">
              ${ex.wordsToFind.map(w => `<li>🔍 ${w}</li>`).join("")}
            </ul>
          </div>
        </div>
      `;
    }

    if (ex.type === "fill-blanks") {
      return `
        <div class="my-3 space-y-3">
          ${ex.wordBank ? `
            <div class="p-2 bg-slate-100 rounded-lg text-xs font-mono font-bold flex flex-wrap gap-2 items-center">
              <span class="text-slate-500 uppercase text-[10px]">Banco de Palavras:</span>
              ${ex.wordBank.map(w => `<span class="bg-white px-2 py-0.5 rounded border border-slate-300">${w}</span>`).join("")}
            </div>
          ` : ""}
          <div class="space-y-2 mt-2">
            ${ex.clues.map(c => `
              <div class="text-xs font-medium text-slate-800 py-1 border-b border-dotted border-slate-300">
                ${c.text.replace("____", "___________________")}
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    if (ex.type === "draw-box") {
      return `
        <div class="my-3">
          <div class="w-full h-32 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50/50 flex items-center justify-center text-xs text-slate-400">
            Espaço para o teu desenho / ilustração 🎨
          </div>
          ${ex.answerLines ? `
            <div class="mt-3 space-y-2">
              ${ex.answerLines.map(l => `<div class="text-xs font-bold text-slate-700">${l}</div>`).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    // Handwriting / Caligrafia (dupla pauta escolar)
    return `
      <div class="my-4">
        ${ex.textToCopy ? `
          <div class="text-xs italic text-slate-500 mb-2">${ex.textToCopy}</div>
        ` : ""}
        ${Array.from({ length: ex.linesCount || 2 }).map(() => `
          <div class="calligraphy-line"></div>
        `).join("")}
      </div>
    `;
  }

  _renderSolutionsHTML(sheet) {
    const totalPoints = sheet.exercises.reduce((acc, ex) => acc + (ex.points || 0), 0);

    return `
      <div class="solutions-container text-slate-900 text-xs">
        <div class="border-b-2 border-slate-800 pb-3 mb-6 flex justify-between items-end">
          <div>
            <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[11px] uppercase tracking-wider">
              Documento Exclusivo do Professor
            </span>
            <h2 class="text-xl font-black text-slate-900 mt-1">
              Critérios de Correção e Grelha de Soluções
            </h2>
            <p class="text-slate-500 text-xs">${sheet.title} (${sheet.year}º Ano) • Total de ${sheet.exercises.length} Perguntas</p>
          </div>
          <div class="text-right">
            <span class="text-xs font-bold text-slate-600">Cotação Total:</span>
            <span class="text-lg font-black text-slate-900 ml-1">${totalPoints} Pontos</span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${sheet.exercises.map(ex => `
            <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70">
              <div class="flex justify-between items-center font-bold text-slate-800 mb-1.5">
                <span>Ex. ${ex.number}: ${ex.prompt.substring(0, 50)}...</span>
                <span class="text-emerald-700 font-black">${ex.points} pts</span>
              </div>
              <div class="bg-white p-2.5 rounded-lg border border-slate-200 font-medium text-slate-700 text-[11px]">
                <strong>Solução:</strong> ${ex.solutionText || "Critério de avaliação correspondente à resposta correta."}
              </div>
            </div>
          `).join("")}
        </div>

        <div class="mt-8 pt-4 border-t border-slate-200 text-[11px] text-slate-400 text-center">
          Alinhado com as Aprendizagens Essenciais DGE (Portugal)
        </div>
      </div>
    `;
  }

  _bindEvents() {
    // 1. Mudança de Ano
    this.container.querySelectorAll(".btn-select-year").forEach(btn => {
      btn.addEventListener("click", () => {
        this.selectedYear = parseInt(btn.getAttribute("data-year"), 10);
        const selectDomain = this.container.querySelector("#select-domain");
        if (selectDomain) {
          selectDomain.innerHTML = this._getDomainsOptions();
          this.selectedDomain = selectDomain.value;
        }
        this.render();
      });
    });

    // 2. Mudança de Disciplina
    this.container.querySelectorAll(".btn-select-subject").forEach(btn => {
      btn.addEventListener("click", () => {
        this.selectedSubject = btn.getAttribute("data-subject");
        this.render();
      });
    });

    // 3. Mudança de Domínio
    this.container.querySelector("#select-domain")?.addEventListener("change", (e) => {
      this.selectedDomain = e.target.value;
    });

    // 4. Mudança do Número de Perguntas (Botões Rápidos 3, 5, 10, 15, 20)
    this.container.querySelectorAll(".btn-set-count").forEach(btn => {
      btn.addEventListener("click", () => {
        this.exerciseCount = parseInt(btn.getAttribute("data-count"), 10);
        this._regenerateWithCurrentCount();
      });
    });

    // Slider Deslizante de 1 a 20
    this.container.querySelector("#slider-exercise-count")?.addEventListener("input", (e) => {
      this.exerciseCount = parseInt(e.target.value, 10);
      const numInput = this.container.querySelector("#input-number-count");
      if (numInput) numInput.value = this.exerciseCount;
    });

    this.container.querySelector("#slider-exercise-count")?.addEventListener("change", (e) => {
      this.exerciseCount = parseInt(e.target.value, 10);
      this._regenerateWithCurrentCount();
    });

    // Campo Numérico Direto de 1 a 20
    this.container.querySelector("#input-number-count")?.addEventListener("change", (e) => {
      let val = parseInt(e.target.value, 10) || 4;
      val = Math.max(1, Math.min(20, val));
      this.exerciseCount = val;
      this._regenerateWithCurrentCount();
    });

    // 5. Mudança de Nível de Diferenciação
    this.container.querySelectorAll("input[name='pedagogical-level']").forEach(radio => {
      radio.addEventListener("change", (e) => {
        this.selectedLevel = e.target.value;
      });
    });

    // 6. Mudança de Tipo de Documento Oficial
    this.container.querySelector("#select-sheet-type")?.addEventListener("change", (e) => {
      this.selectedType = e.target.value;
      if (this.currentSheet) this.currentSheet.type = e.target.value;
      this.render();
    });

    // 6.1 Seletor Rápido dos 3 Modelos Oficiais no Topo da Folha
    this.container.querySelectorAll(".btn-quick-type").forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.getAttribute("data-type");
        this.selectedType = type;
        if (this.currentSheet) this.currentSheet.type = type;
        this.render();
      });
    });

    // 6.2 Seletor de Período Letivo
    this.container.querySelectorAll(".btn-select-period").forEach(btn => {
      btn.addEventListener("click", () => {
        const period = parseInt(btn.getAttribute("data-period"), 10);
        this.selectedPeriod = period;
        if (this.currentSheet) this.currentSheet.period = period;
        this.render();
      });
    });

    // 7. Checkbox de Soluções
    this.container.querySelector("#chk-show-solutions")?.addEventListener("change", (e) => {
      this.showSolutions = e.target.checked;
      this.render();
    });

    // 8. Botão Imprimir na Impressora de Rede / PDF
    const triggerPrint = () => {
      if (typeof networkPrinter !== "undefined") {
        networkPrinter.printSheet();
      } else {
        window.print();
      }
    };
    this.container.querySelector("#btn-print-sheet")?.addEventListener("click", triggerPrint);
    this.container.querySelector("#btn-quick-print")?.addEventListener("click", triggerPrint);
    this.container.querySelector("#btn-network-printer-settings")?.addEventListener("click", () => {
      if (typeof networkPrinter !== "undefined") {
        networkPrinter.openModal();
      }
    });

    // 9. Abrir Modo Aluno
    this.container.querySelector("#btn-open-student")?.addEventListener("click", () => {
      if (this.onOpenStudentMode) {
        this.onOpenStudentMode(this.currentSheet);
      }
    });

    // 9.1 Abrir Apoio ao Estudo
    this.container.querySelector("#btn-open-study-support")?.addEventListener("click", () => {
      if (this.onOpenStudySupport) {
        this.onOpenStudySupport();
      }
    });

    // 9.2 Abrir Painel de Administração
    this.container.querySelector("#btn-open-admin-panel")?.addEventListener("click", () => {
      if (this.onOpenAdminPanel) {
        this.onOpenAdminPanel();
      }
    });

    // 9.3 Terminar Sessão (Logout)
    this.container.querySelector("#btn-header-logout")?.addEventListener("click", () => {
      if (this.onLogout) {
        this.onLogout();
      }
    });

    // 8.3 Janela de IA para Escrever o Teste
    this.container.querySelector("#btn-open-ai-prompt-window")?.addEventListener("click", () => {
      this._openAIPromptModal();
    });

    this.container.querySelector("#btn-expand-ai-modal")?.addEventListener("click", () => {
      const text = this.container.querySelector("#sidebar-ai-prompt")?.value || "";
      this._openAIPromptModal(text);
    });

    // Chips de ideias na barra lateral
    this.container.querySelectorAll(".btn-prompt-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const text = chip.getAttribute("data-text");
        const textarea = this.container.querySelector("#sidebar-ai-prompt");
        if (textarea) {
          textarea.value = text;
          textarea.focus();
        }
      });
    });

    // Arrastar ou selecionar imagem diretamente na barra lateral da IA
    const sidebarDropzone = this.container.querySelector("#sidebar-ai-image-dropzone");
    if (sidebarDropzone) {
      sidebarDropzone.addEventListener("click", () => {
        if (!this.selectedAIImage && this.uploadedImages.length > 0) {
          // Se tiver imagens na caixa, escolhe a primeira ou abre seletor
          this.selectedAIImage = this.uploadedImages[0];
          this.render();
        } else {
          // Clica para carregar ficheiro
          const tempInput = document.createElement("input");
          tempInput.type = "file";
          tempInput.accept = "image/*";
          tempInput.onchange = (e) => {
            const file = e.target.files?.[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (re) => {
                this._addImageToGallery(re.target.result, file.name);
                this.selectedAIImage = { name: file.name, dataUrl: re.target.result };
                this.render();
              };
              reader.readAsDataURL(file);
            }
          };
          tempInput.click();
        }
      });

      ["dragenter", "dragover"].forEach(evt => {
        sidebarDropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          sidebarDropzone.classList.add("border-purple-600", "bg-purple-100");
        });
      });

      ["dragleave", "drop"].forEach(evt => {
        sidebarDropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          sidebarDropzone.classList.remove("border-purple-600", "bg-purple-100");
        });
      });

      sidebarDropzone.addEventListener("drop", (e) => {
        const file = e.dataTransfer?.files?.[0];
        if (file && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (re) => {
            this._addImageToGallery(re.target.result, file.name);
            this.selectedAIImage = { name: file.name, dataUrl: re.target.result };
            this.render();
            if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    this.container.querySelector("#btn-sidebar-remove-ai-img")?.addEventListener("click", (e) => {
      e.stopPropagation();
      this.selectedAIImage = null;
      this.render();
    });

    // Gerar diretamente a partir da barra lateral
    this.container.querySelector("#btn-sidebar-generate-ai")?.addEventListener("click", async () => {
      const textarea = this.container.querySelector("#sidebar-ai-prompt");
      const promptText = textarea ? textarea.value.trim() : "";
      if (!promptText) {
        this._openAIPromptModal("", this.selectedAIImage);
        return;
      }

      const btn = this.container.querySelector("#btn-sidebar-generate-ai");
      btn.disabled = true;
      btn.innerHTML = this.selectedAIImage 
        ? `<span>⏳ A IA está a analisar a imagem e a construir o teste...</span>`
        : `<span>⏳ A gerar com IA...</span>`;

      try {
        const newSheet = await aiEngine.generateFromTeacherPrompt(promptText, {
          year: this.selectedYear,
          subjectId: this.selectedSubject,
          exerciseCount: this.exerciseCount,
          level: this.selectedLevel,
          teacherName: this.currentSheet.schoolHeader?.teacherName,
          schoolName: this.currentSheet.schoolHeader?.schoolName,
          image: this.selectedAIImage
        });

        this.currentSheet = newSheet;
        this._normalizeExercises();
        this.selectedYear = newSheet.year || this.selectedYear;
        this.selectedSubject = newSheet.subject || this.selectedSubject;
        this.render();

        soundEffects.playSuccess();
        alert(`✨ Prova criada com sucesso pela IA!\n"${newSheet.title}" com ${newSheet.exercises.length} perguntas e 100 pontos distribuídos.`);
      } catch (err) {
        alert("Erro ao gerar com IA: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<span>🚀 Gerar Teste com IA</span>`;
      }
    });

    // 10. Gerar com IA (Modal)
    this.container.querySelector("#btn-generate-ai")?.addEventListener("click", () => {
      this._openAIPromptModal();
    });

    // 11. Explorar Biblioteca
    this.container.querySelector("#btn-browse-library")?.addEventListener("click", () => {
      this._openLibraryModal();
    });

    // 12. Configurar Chave Gemini API (Apenas Administrador)
    this.container.querySelector("#btn-api-settings")?.addEventListener("click", () => {
      if (!authManager.isAdmin()) {
        alert("Apenas o Administrador do Agrupamento tem permissão para aceder à configuração da IA.");
        return;
      }
      this._openSettingsModal();
    });

    // 13. Eliminar Pergunta Individual da Folha
    this.container.querySelectorAll(".btn-delete-exercise").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-index"), 10);
        if (this.currentSheet.exercises.length <= 1) {
          alert("O teste deve ter pelo menos 1 pergunta.");
          return;
        }
        this.currentSheet.exercises.splice(idx, 1);
        this._normalizeExercises();
        this.render();
      });
    });

    // 14. Adicionar Pergunta Rápida (até 20)
    this.container.querySelector("#btn-add-quick-exercise")?.addEventListener("click", () => {
      if (this.currentSheet.exercises.length >= 20) {
        alert("O teste já atingiu o limite máximo de 20 perguntas.");
        return;
      }
      this._addNewExercisePrompt();
    });

    // 15. Gestão de Imagens (Download, Arraste e Inserção)
    this._bindImageEvents();
  }

  async _regenerateWithCurrentCount() {
    const newSheet = await aiEngine.generateWorksheet({
      year: this.selectedYear,
      subjectId: this.selectedSubject,
      domainId: this.selectedDomain,
      level: this.selectedLevel,
      type: this.selectedType,
      exerciseCount: this.exerciseCount,
      schoolName: this.currentSheet.schoolHeader?.schoolName,
      teacherName: this.currentSheet.schoolHeader?.teacherName
    });

    this.currentSheet = newSheet;
    this._normalizeExercises();
    this.render();
  }

  _addNewExercisePrompt() {
    const newNumber = this.currentSheet.exercises.length + 1;
    this.currentSheet.exercises.push({
      id: `ex${newNumber}`,
      number: newNumber,
      type: "handwriting-lines",
      points: 5,
      prompt: `Pergunta ${newNumber}: Responde por extenso com clareza e caligrafia caprichada.`,
      textToCopy: "Copia aqui o enunciado ou texto orientado pelo professor...",
      linesCount: 2,
      solutionText: "Critério de avaliação correspondente à resposta formulada pelo aluno."
    });
    this._normalizeExercises();
    this.render();
  }

              </span>
            </div>
            <span class="text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-black">100 Pts Automáticos</span>
          </div>

          <!-- Ações do Fundo: Botão Cancelar (com X) e Botão Gerar -->
          <div class="flex items-center gap-2 sm:gap-3 pt-2">
            <button type="button" id="btn-cancel-ai-modal" class="h-12 sm:h-14 px-4 sm:px-6 rounded-2xl border-2 border-slate-300 hover:border-slate-400 hover:bg-slate-100 text-slate-700 font-extrabold text-xs sm:text-sm transition flex items-center justify-center gap-1.5 shadow-xs active:scale-95 cursor-pointer flex-shrink-0" title="Cancelar e fechar janela">
              <span class="text-base font-black text-red-500">✕</span>
              <span>Cancelar</span>
            </button>
            <button id="btn-modal-confirm-ai-prompt" class="flex-1 h-12 sm:h-14 bg-gradient-to-r from-purple-600 via-indigo-600 to-violet-700 hover:from-purple-700 hover:to-indigo-700 text-white font-black rounded-2xl shadow-xl transition flex items-center justify-center gap-2 text-xs sm:text-base transform hover:scale-[1.01] active:scale-98 cursor-pointer">
              <span>🚀</span>
              <span id="btn-modal-confirm-text">${attachedImg ? "Gerar Teste com IA Baseado na Imagem" : "Gerar Teste com IA Agora"}</span>
            </button>
          </div>
        </div>

      </div>
    `;

    document.body.appendChild(modal);

    const closeModal = () => {
      document.removeEventListener("keydown", handleKeydown);
      modal.remove();
    };

    const handleKeydown = (e) => {
      if (e.key === "Escape") {
        closeModal();
      }
    };
    document.addEventListener("keydown", handleKeydown);

    modal.querySelector("#btn-close-ai-modal")?.addEventListener("click", closeModal);
    modal.querySelector("#btn-cancel-ai-modal")?.addEventListener("click", closeModal);

    // Fechar ao clicar fora da janela (fundo escuro)
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Gestão de Imagem Anexada dentro do Modal
    const modalDropzone = modal.querySelector("#modal-ai-image-dropzone");
    const modalFileInput = modal.querySelector("#modal-ai-file-input");
    const modalAttachedCard = modal.querySelector("#modal-attached-img-card");
    const modalImgPreview = modal.querySelector("#modal-attached-img-preview");
    const modalImgName = modal.querySelector("#modal-attached-img-name");
    const modalBtnRemoveImg = modal.querySelector("#btn-modal-remove-attached-img");
    const modalBtnConfirmText = modal.querySelector("#btn-modal-confirm-text");

    const updateAttachedImageUI = (img) => {
      attachedImg = img;
      if (img) {
        modalImgPreview.src = img.dataUrl;
        modalImgName.textContent = img.name;
        modalAttachedCard.classList.remove("hidden");
        modalAttachedCard.classList.add("flex");
        if (modalBtnConfirmText) modalBtnConfirmText.textContent = "Gerar Teste com IA Baseado na Imagem";
      } else {
        modalAttachedCard.classList.remove("flex");
        modalAttachedCard.classList.add("hidden");
        if (modalBtnConfirmText) modalBtnConfirmText.textContent = "Gerar Teste com IA Agora";
      }
    };

    if (modalDropzone && modalFileInput) {
      modalDropzone.addEventListener("click", () => modalFileInput.click());

      ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
        modalDropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      ["dragenter", "dragover"].forEach(eventName => {
        modalDropzone.addEventListener(eventName, () => {
          modalDropzone.classList.add("border-purple-600", "bg-purple-100", "ring-2", "ring-purple-200");
        });
      });

      ["dragleave", "drop"].forEach(eventName => {
        modalDropzone.addEventListener(eventName, () => {
          modalDropzone.classList.remove("border-purple-600", "bg-purple-100", "ring-2", "ring-purple-200");
        });
      });

      modalDropzone.addEventListener("drop", (e) => {
        const file = e.dataTransfer?.files?.[0];
        if (file && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (re) => {
            const newImg = { name: file.name, dataUrl: re.target.result };
            this._addImageToGallery(re.target.result, file.name);
            updateAttachedImageUI(newImg);
          };
          reader.readAsDataURL(file);
        }
      });

      modalFileInput.addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (file && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (re) => {
            const newImg = { name: file.name, dataUrl: re.target.result };
            this._addImageToGallery(re.target.result, file.name);
            updateAttachedImageUI(newImg);
          };
          reader.readAsDataURL(file);
          modalFileInput.value = "";
        }
      });
    }

    modalBtnRemoveImg?.addEventListener("click", () => {
      updateAttachedImageUI(null);
    });

    modal.querySelectorAll(".btn-modal-pick-box-img").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-img-idx"), 10);
        const item = this.uploadedImages[idx];
        if (item) {
          updateAttachedImageUI(item);
        }
      });
    });

    modal.querySelectorAll(".btn-modal-sample-prompt").forEach(btn => {
      btn.addEventListener("click", () => {
        const text = btn.getAttribute("data-text");
        modal.querySelector("#modal-ai-user-prompt").value = text;
      });
    });

    modal.querySelector("#btn-modal-confirm-ai-prompt").addEventListener("click", async () => {
      const promptText = modal.querySelector("#modal-ai-user-prompt").value.trim();
      if (!promptText && !attachedImg) {
        alert("Por favor, escreve o que pretendes que o teste contenha ou anexa uma imagem para a IA analisar.");
        return;
      }

      const overrideYear = parseInt(modal.querySelector("#modal-override-year").value, 10);
      let overrideCount = parseInt(modal.querySelector("#modal-override-count").value, 10) || 5;
      overrideCount = Math.max(1, Math.min(20, overrideCount));
      const overrideLevel = modal.querySelector("#modal-override-level").value;

      const btn = modal.querySelector("#btn-modal-confirm-ai-prompt");
      const btnCancel = modal.querySelector("#btn-cancel-ai-modal");
      btn.disabled = true;
      if (btnCancel) btnCancel.disabled = true;
      btn.innerHTML = attachedImg
        ? `<span>⏳ A IA está a analisar a imagem e a construir o teste personalizado...</span>`
        : `<span>⏳ A IA está a analisar o teu pedido e a construir a prova...</span>`;

      try {
        const effectivePrompt = promptText || (attachedImg 
          ? `Cria uma ficha de avaliação personalizada para o 1º Ciclo baseada na imagem em anexo ("${attachedImg.name}"). Elabora perguntas pedagógicas adequadas ao ano de escolaridade.`
          : "");

        const newSheet = await aiEngine.generateFromTeacherPrompt(effectivePrompt, {
          year: overrideYear,
          subjectId: this.selectedSubject,
          exerciseCount: overrideCount,
          level: overrideLevel,
          teacherName: this.currentSheet.schoolHeader?.teacherName,
          schoolName: this.currentSheet.schoolHeader?.schoolName,
          image: attachedImg
        });

        this.selectedAIImage = attachedImg;
        this.currentSheet = newSheet;
        this._normalizeExercises();
        this.selectedYear = newSheet.year || overrideYear;
        this.selectedSubject = newSheet.subject || this.selectedSubject;
        this.selectedLevel = newSheet.level || overrideLevel;
        this.exerciseCount = newSheet.exercises.length;
        this.render();

        soundEffects.playSuccess();
        closeModal();

        alert(`✨ Prova criada com sucesso pela IA!\n"${newSheet.title}" com ${newSheet.exercises.length} perguntas e 100 pontos distribuídos.`);
      } catch (err) {
        console.error("Erro na geração com IA:", err);
        btn.disabled = false;
        if (btnCancel) btnCancel.disabled = false;
        btn.innerHTML = `<span>🚀 Tentar Novamente</span>`;
        alert("Ocorreu um erro ao gerar a prova: " + err.message);
      }
    });
  }

              Inserir
            </button>
            <button type="button" class="btn-ai-from-image bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-[10px] font-extrabold px-2 py-1 rounded-lg shadow-xs transition active:scale-95 flex items-center gap-1" data-img-idx="${idx}" title="Pedir à IA para criar um teste baseado nesta imagem">
              <span>✨</span> <span>Criar Teste com IA</span>
            </button>
          </div>
        </div>

        <!-- Botão Eliminar -->
        <button type="button" class="btn-delete-uploaded-img text-slate-400 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition text-xs flex-shrink-0" data-img-idx="${idx}" title="Remover da caixa">
          🗑️
        </button>
      </div>
    `).join("");
  }

  _bindImageEvents() {
    // 1. Zona de Arraste Principal (Dropzone na barra lateral)
    const dropzone = this.container.querySelector("#image-dropzone");
    const fileInput = this.container.querySelector("#input-image-file");

    if (dropzone && fileInput) {
      dropzone.addEventListener("click", () => fileInput.click());

      ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      ["dragenter", "dragover"].forEach(eventName => {
        dropzone.addEventListener(eventName, () => {
          dropzone.classList.add("border-purple-600", "bg-purple-100", "ring-4", "ring-purple-200", "scale-[1.02]");
        });
      });

      ["dragleave", "drop"].forEach(eventName => {
        dropzone.addEventListener(eventName, () => {
          dropzone.classList.remove("border-purple-600", "bg-purple-100", "ring-4", "ring-purple-200", "scale-[1.02]");
        });
      });

      dropzone.addEventListener("drop", (e) => {
        const files = e.dataTransfer?.files;
        if (files && files.length > 0) {
          this._handleImageFilesUpload(files);
        }
      });

      fileInput.addEventListener("change", (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          this._handleImageFilesUpload(files);
          fileInput.value = "";
        }
      });
    }

    // 2. Descarregar por Link / URL da Web
    const urlInput = this.container.querySelector("#input-image-url");
    const btnDownloadUrl = this.container.querySelector("#btn-download-image-url");
    if (btnDownloadUrl && urlInput) {
      const handleDownload = () => {
        const url = urlInput.value.trim();
        if (!url) {
          alert("Por favor insere o link/URL da imagem que pretendes descarregar.");
          return;
        }
        btnDownloadUrl.disabled = true;
        btnDownloadUrl.innerHTML = `<span>⏳</span> <span>A descarregar...</span>`;
        
        const testImg = new Image();
        testImg.crossOrigin = "anonymous";
        testImg.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = testImg.naturalWidth;
            canvas.height = testImg.naturalHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(testImg, 0, 0);
            const dataUrl = canvas.toDataURL("image/png");
            this._addImageToGallery(dataUrl, url.split("/").pop().split("?")[0] || "Imagem Descarregada");
          } catch (e) {
            this._addImageToGallery(url, url.split("/").pop().split("?")[0] || "Imagem Descarregada");
          }
          urlInput.value = "";
          btnDownloadUrl.disabled = false;
          btnDownloadUrl.innerHTML = `<span>🌐</span> <span>Descarregar</span>`;
          if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
          alert("✨ Imagem descarregada com sucesso e adicionada à Caixa de Imagens!");
        };
        testImg.onerror = () => {
          btnDownloadUrl.disabled = false;
          btnDownloadUrl.innerHTML = `<span>🌐</span> <span>Descarregar</span>`;
          alert("Não foi possível carregar a imagem desse URL. Certifica-te de que o link termina em .png, .jpg ou .webp e é acessível.");
        };
        testImg.src = url;
      };

      btnDownloadUrl.addEventListener("click", handleDownload);
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleDownload();
        }
      });
    }

    // 3. Botões Rápidos de Ilustrações Prontas (Clipart 1º Ciclo)
    this.container.querySelectorAll(".btn-quick-preset-img").forEach(btn => {
      btn.addEventListener("click", () => {
        const presetId = btn.getAttribute("data-preset");
        const presets = (typeof window !== "undefined" && window.DEFAULT_IMAGE_PRESETS)
          ? window.DEFAULT_IMAGE_PRESETS
          : (typeof DEFAULT_IMAGE_PRESETS !== "undefined" ? DEFAULT_IMAGE_PRESETS : []);
        const found = presets.find(p => p.id === presetId);
        if (found) {
          this._addImageToGallery(found.dataUrl, found.name);
          if (typeof soundEffects !== "undefined") soundEffects.playClick();
        }
      });
    });

    // 4. Inserir Imagem da Galeria na Prova
    this.container.querySelectorAll(".btn-apply-insert-image").forEach(btn => {
      btn.addEventListener("click", () => {
        const imgIdx = parseInt(btn.getAttribute("data-img-idx"), 10);
        const item = this.uploadedImages[imgIdx];
        if (!item) return;

        const select = this.container.querySelector(`.select-insert-target[data-img-idx="${imgIdx}"]`);
        const targetVal = select ? select.value : "0";

        if (targetVal === "new") {
          if (this.currentSheet.exercises.length >= 20) {
            alert("A prova já tem o número máximo de 20 perguntas.");
            return;
          }
          const nextNum = this.currentSheet.exercises.length + 1;
          this.currentSheet.exercises.push({
            id: `ex${nextNum}`,
            number: nextNum,
            type: "multiple-choice",
            points: 10,
            prompt: `Observa a imagem abaixo e responde à questão:`,
            image: item.dataUrl,
            options: [
              { text: "Opção A correta", isCorrect: true },
              { text: "Opção B", isCorrect: false },
              { text: "Opção C", isCorrect: false }
            ],
            solutionText: "Resposta fundamentada na observação da imagem."
          });
          this._normalizeExercises();
          this.render();
          if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
          alert(`✨ Nova pergunta ${nextNum} criada com a imagem "${item.name}"!`);
        } else if (targetVal === "logo") {
          this.customSchoolLogo = item.dataUrl;
          this.render();
          if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
          alert("✨ Logótipo do cabeçalho da prova atualizado com sucesso!");
        } else {
          const exIdx = parseInt(targetVal, 10);
          if (this.currentSheet.exercises[exIdx]) {
            this.currentSheet.exercises[exIdx].image = item.dataUrl;
            this.render();
            if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
            alert(`✨ Imagem inserida com sucesso na Pergunta ${this.currentSheet.exercises[exIdx].number}!`);
          }
        }
      });
    });

    // 4.1. Criar Teste com IA a partir de Imagem da Caixa
    this.container.querySelectorAll(".btn-ai-from-image").forEach(btn => {
      btn.addEventListener("click", () => {
        const imgIdx = parseInt(btn.getAttribute("data-img-idx"), 10);
        const item = this.uploadedImages[imgIdx];
        if (item) {
          this.selectedAIImage = item;
          this._openAIPromptModal(
            `Cria uma ficha de avaliação para o 1º Ciclo explorando detalhadamente a imagem em anexo ("${item.name}"). Formula perguntas pedagógicas e adequadas ao ano curricular baseadas no que está visível na ilustração.`,
            item
          );
        }
      });
    });

    // 5. Eliminar imagem da caixa
    this.container.querySelectorAll(".btn-delete-uploaded-img").forEach(btn => {
      btn.addEventListener("click", () => {
        const imgIdx = parseInt(btn.getAttribute("data-img-idx"), 10);
        this.uploadedImages.splice(imgIdx, 1);
        this._saveImages();
        this.render();
      });
    });

    // 6. Limpar todas as imagens
    this.container.querySelector("#btn-clear-images")?.addEventListener("click", () => {
      if (confirm("Tens a certeza de que queres limpar as imagens da caixa?")) {
        this.uploadedImages = [];
        this._saveImages();
        this.render();
      }
    });

    // 7. Zonas de Arraste Direto em CADA PERGUNTA (Folha A4)
    this.container.querySelectorAll(".dropzone-single-ex").forEach(dropArea => {
      const exIdx = parseInt(dropArea.getAttribute("data-index"), 10);

      dropArea.addEventListener("click", () => {
        const tempInput = document.createElement("input");
        tempInput.type = "file";
        tempInput.accept = "image/*";
        tempInput.onchange = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (re) => {
              this.currentSheet.exercises[exIdx].image = re.target.result;
              this._addImageToGallery(re.target.result, file.name);
              this.render();
            };
            reader.readAsDataURL(file);
          }
        };
        tempInput.click();
      });

      ["dragenter", "dragover"].forEach(evt => {
        dropArea.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropArea.classList.add("border-purple-600", "bg-purple-100", "text-purple-900", "scale-[1.01]");
        });
      });

      ["dragleave", "drop"].forEach(evt => {
        dropArea.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropArea.classList.remove("border-purple-600", "bg-purple-100", "text-purple-900", "scale-[1.01]");
        });
      });

      dropArea.addEventListener("drop", (e) => {
        const file = e.dataTransfer?.files?.[0];
        if (file && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (re) => {
            this.currentSheet.exercises[exIdx].image = re.target.result;
            this._addImageToGallery(re.target.result, file.name);
            this.render();
            if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
          };
          reader.readAsDataURL(file);
        }
      });
    });

    // 8. Botão "Imagem" no topo de cada pergunta
    this.container.querySelectorAll(".btn-trigger-ex-image").forEach(btn => {
      btn.addEventListener("click", () => {
        const exIdx = parseInt(btn.getAttribute("data-index"), 10);
        const tempInput = document.createElement("input");
        tempInput.type = "file";
        tempInput.accept = "image/*";
        tempInput.onchange = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (re) => {
              this.currentSheet.exercises[exIdx].image = re.target.result;
              this._addImageToGallery(re.target.result, file.name);
              this.render();
            };
            reader.readAsDataURL(file);
          }
        };
        tempInput.click();
      });
    });

    // 9. Remover imagem da pergunta
    this.container.querySelectorAll(".btn-remove-ex-image").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const exIdx = parseInt(btn.getAttribute("data-index"), 10);
        if (this.currentSheet.exercises[exIdx]) {
          delete this.currentSheet.exercises[exIdx].image;
          this.render();
        }
      });
    });

    // 10. Alternar tamanho da imagem na pergunta (Pequeno 130px -> Médio 210px -> Grande 300px)
    this.container.querySelectorAll(".btn-toggle-img-size").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const exIdx = parseInt(btn.getAttribute("data-index"), 10);
        const ex = this.currentSheet.exercises[exIdx];
        if (ex) {
          const currentSize = ex.imageSize || 210;
          if (currentSize === 130) ex.imageSize = 210;
          else if (currentSize === 210) ex.imageSize = 300;
          else ex.imageSize = 130;
          this.render();
        }
      });
    });

    // 11. Botão de atalho para rolar até à Caixa de Imagens
    this.container.querySelector("#btn-scroll-to-images")?.addEventListener("click", () => {
      const box = this.container.querySelector("#image-box-card");
      if (box) {
        box.scrollIntoView({ behavior: "smooth", block: "center" });
        box.classList.add("ring-4", "ring-purple-300");
        setTimeout(() => box.classList.remove("ring-4", "ring-purple-300"), 1500);
      }
    });
  }

  _handleImageFilesUpload(files) {
    let loadedCount = 0;
    Array.from(files).forEach(file => {
      if (!file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        this._addImageToGallery(e.target.result, file.name);
        loadedCount++;
        if (loadedCount === files.length) {
          if (typeof soundEffects !== "undefined") soundEffects.playSuccess();
        }
      };
      reader.readAsDataURL(file);
    });
  }

  _addImageToGallery(dataUrl, name = "Imagem") {
    this.uploadedImages = this.uploadedImages.filter(img => img.dataUrl !== dataUrl);
    this.uploadedImages.unshift({
      id: "img-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4),
      name: name,
      dataUrl: dataUrl
    });
    if (this.uploadedImages.length > 30) this.uploadedImages.pop();
    this._saveImages();
    this.render();
  }
}


// Ponto de Entrada da Aplicação Educa AI com Autenticação e Administrador RBAC

document.addEventListener("DOMContentLoaded", () => {
  const loginContainer = document.getElementById("login-container");
  const adminPanelContainer = document.getElementById("admin-panel-container");
  const teacherAppRoot = document.getElementById("app-root");
  const studentModeContainer = document.getElementById("student-mode-container");
  const studySupportContainer = document.getElementById("study-support-container");

  let teacherAppInstance = null;
  let studentModeInstance = null;
  let studySupportInstance = null;
  let adminPanelInstance = null;
  let loginScreenInstance = null;

  function hideAllViews() {
    if (loginContainer) loginContainer.classList.add("hidden");
    if (adminPanelContainer) adminPanelContainer.classList.add("hidden");
    if (teacherAppRoot) teacherAppRoot.classList.add("hidden");
    if (studentModeContainer) studentModeContainer.classList.add("hidden");
    if (studySupportContainer) studySupportContainer.classList.add("hidden");
  }

  function handleLogout() {
    authManager.logout();
    teacherAppInstance = null;
    studySupportInstance = null;
    studentModeInstance = null;
    adminPanelInstance = null;
    hideAllViews();
    showLogin();
  }

  function showLogin() {
    window.scrollTo({ top: 0, behavior: "smooth" });
    hideAllViews();
    if (loginContainer) {
      loginContainer.classList.remove("hidden");
      if (!loginScreenInstance) {
        loginScreenInstance = new LoginScreen(loginContainer, (user) => {
          routeUser(user);
        });
      }
      loginScreenInstance.render();
    }
  }

  function showAdminPanel() {
    const user = authManager.getCurrentUser();
    if (!user) return showLogin();

    if (!authManager.hasPermission("admin_panel")) {
      alert("Acesso restrito ao Administrador do Agrupamento.");
      return routeUser(user);
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
    hideAllViews();
    if (adminPanelContainer) {
      adminPanelContainer.classList.remove("hidden");
      if (!adminPanelInstance) {
        adminPanelInstance = new AdminPanel(adminPanelContainer, () => {
          routeUser(authManager.getCurrentUser());
        });
      }
      adminPanelInstance.render();
    }
  }

  function openTeacherGenerator() {
    const user = authManager.getCurrentUser();
    if (!user) return showLogin();

    if (!authManager.hasPermission("teacher_generator")) {
      // Se não tiver permissão para o gerador (ex: perfil de Aluno), abre o modo aluno ou apoio
      if (authManager.hasPermission("student_mode")) {
        return openStudentMode();
      }
      return openStudySupport();
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
    hideAllViews();
    if (teacherAppRoot) {
      teacherAppRoot.classList.remove("hidden");

      if (!teacherAppInstance) {
        teacherAppInstance = new TeacherGenerator(
          teacherAppRoot, 
          openStudentMode, 
          openStudySupport,
          showAdminPanel,
          handleLogout
        );
        teacherAppInstance.init();
      } else {
        teacherAppInstance.render();
      }
    }
  }

  function openStudentMode(sheet) {
    const user = authManager.getCurrentUser();
    if (!user) return showLogin();

    if (!authManager.hasPermission("student_mode")) {
      alert("O seu perfil não tem acesso concedido ao Modo Aluno.");
      return routeUser(user);
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
    hideAllViews();
    if (studentModeContainer) {
      studentModeContainer.classList.remove("hidden");

      if (!studentModeInstance) {
        studentModeInstance = new StudentMode(
          studentModeContainer, 
          () => {
            // Ao sair do modo aluno
            if (authManager.hasPermission("teacher_generator")) {
              openTeacherGenerator();
            } else if (authManager.hasPermission("study_support")) {
              openStudySupport();
            } else {
              handleLogout();
            }
          },
          handleLogout
        );
      }

      // Se não houver ficha carregada (ex: aluno fez login direto), usa a ficha padrão
      const defaultSheet = sheet || (teacherAppInstance ? teacherAppInstance.currentSheet : null) || (window.SAMPLE_SHEETS ? window.SAMPLE_SHEETS[0] : null);
      studentModeInstance.start(defaultSheet);
    }
  }

  function openStudySupport() {
    const user = authManager.getCurrentUser();
    if (!user) return showLogin();

    if (!authManager.hasPermission("study_support")) {
      alert("O seu perfil não tem acesso concedido ao Centro de Apoio ao Estudo.");
      return routeUser(user);
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
    hideAllViews();
    if (studySupportContainer) {
      studySupportContainer.classList.remove("hidden");

      if (!studySupportInstance) {
        studySupportInstance = new StudySupport(
          studySupportContainer, 
          () => {
            if (authManager.hasPermission("teacher_generator")) {
              openTeacherGenerator();
            } else if (authManager.hasPermission("student_mode")) {
              openStudentMode();
            } else {
              handleLogout();
            }
          },
          handleLogout
        );
      }

      studySupportInstance.start();
    }
  }

  function routeUser(user) {
    if (!user) return showLogin();

    // Se for Aluno -> direciona diretamente para o Modo Aluno Interativo
    if (user.role === "student") {
      openStudentMode();
      return;
    }

    // Se for Professor ou Administrador -> direciona para o Gerador de Provas e Fichas
    openTeacherGenerator();
  }

  // Suprime o título da janela na impressão para evitar que o navegador imprima "Educa AI..." ou o URL
  let savedDocTitle = document.title;
  window.addEventListener("beforeprint", () => {
    savedDocTitle = document.title;
    document.title = "";
  });
  window.addEventListener("afterprint", () => {
    document.title = savedDocTitle;
  });

  // Inicialização no arranque
  const currentUser = authManager.getCurrentUser();
  if (currentUser) {
    routeUser(currentUser);
  } else {
    showLogin();
  }
});

  </script>
