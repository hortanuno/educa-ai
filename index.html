  _bindEvents() {
    // 1. Fechar Painel de Administração
    this.container.querySelector("#btn-admin-close")?.addEventListener("click", () => {
      if (this.onClose) this.onClose();
    });

    // 2. Mudança de Abas
    this.container.querySelectorAll(".btn-admin-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        this.activeTab = btn.getAttribute("data-tab");
        this.render();
      });
    });

    this.container.querySelector("#btn-tab-create-shortcut")?.addEventListener("click", () => {
      this.activeTab = "create";
      this.render();
    });

    // 3. Pesquisa de Utilizadores
    const searchInput = this.container.querySelector("#input-admin-search");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        this.searchQuery = e.target.value;
        this.render();
        const fresh = this.container.querySelector("#input-admin-search");
        if (fresh) {
          fresh.focus();
          fresh.setSelectionRange(fresh.value.length, fresh.value.length);
        }
      });
    }

    // 4. Abrir Modal de Permissões
    this.container.querySelectorAll(".btn-manage-perms").forEach(btn => {
      btn.addEventListener("click", () => {
        const userId = btn.getAttribute("data-id");
        this.editingPermissionsUser = authManager.getUser(userId);
        this.render();
      });
    });

    // 5. Fechar Modal de Permissões
    this.container.querySelector("#btn-close-perms-modal")?.addEventListener("click", () => {
      this.editingPermissionsUser = null;
      this.render();
    });

    this.container.querySelector("#btn-cancel-perms-modal")?.addEventListener("click", () => {
      this.editingPermissionsUser = null;
      this.render();
    });

    // 6. Submeter Novas Permissões, Palavra-passe e Estado
    const permsForm = this.container.querySelector("#form-edit-permissions");
    if (permsForm && this.editingPermissionsUser) {
      permsForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const updatedPerms = {
          teacher_generator: this.container.querySelector("#modal-perm-teacher").checked,
          student_mode: this.container.querySelector("#modal-perm-student").checked,
          study_support: this.container.querySelector("#modal-perm-study").checked,
          ai_settings: this.editingPermissionsUser.role === "admin",
          view_solutions: this.container.querySelector("#modal-perm-solutions").checked,
          admin_panel: this.container.querySelector("#modal-perm-admin").checked,
          export_sheets: true
        };

        const newPass = this.container.querySelector("#modal-edit-password")?.value.trim();
        const statusRadio = this.container.querySelector('input[name="modal-user-status"]:checked');
        const newStatus = statusRadio ? statusRadio.value : this.editingPermissionsUser.status;

        const updateData = {
          permissions: updatedPerms,
          status: newStatus
        };
        if (newPass) {
          updateData.password = newPass;
        }

        const res = authManager.updateUser(this.editingPermissionsUser.id, updateData);
        if (res.success) {
          soundEffects.playSuccess();
          alert(`Utilizador "${this.editingPermissionsUser.name}" atualizado com sucesso!\nPalavra-passe e acessos guardados.`);
          this.editingPermissionsUser = null;
          this.render();
        } else {
          alert("Erro: " + res.message);
        }
      });

      // Eliminar utilizador a partir de dentro do modal
      this.container.querySelector("#btn-modal-delete-user")?.addEventListener("click", () => {
        if (!this.editingPermissionsUser) return;
        if (confirm(`Tens a certeza absoluta de que pretendes eliminar a conta de "${this.editingPermissionsUser.name}"?`)) {
          const res = authManager.deleteUser(this.editingPermissionsUser.id);
          soundEffects.playEncourage();
          alert(res.message || "Utilizador eliminado.");
          this.editingPermissionsUser = null;
          this.render();
        }
      });
    }

    // 7. Alteração Rápida de Palavra-passe a partir da Tabela
    this.container.querySelectorAll(".btn-change-pass-quick").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const userId = btn.getAttribute("data-id");
        const u = authManager.getUser(userId);
        if (!u) return;

        const newPass = prompt(`Definir nova palavra-passe para "${u.name}" (login: ${u.username}):`, u.password);
        if (newPass !== null) {
          if (!newPass.trim()) {
            alert("A palavra-passe não pode estar vazia.");
            return;
          }
          authManager.setUserPassword(userId, newPass.trim());
          soundEffects.playSuccess();
          alert(`Palavra-passe de "${u.name}" alterada com sucesso para: ${newPass.trim()}`);
          this.render();
        }
      });
    });

    // 8. Bloquear / Desbloquear Conta (1 Clique)
    this.container.querySelectorAll(".btn-toggle-status").forEach(btn => {
      btn.addEventListener("click", () => {
        const userId = btn.getAttribute("data-id");
        const res = authManager.toggleUserStatus(userId);
        if (res.success) {
          soundEffects.playCardFlip();
          alert(res.message);
          this.render();
        } else {
          alert("Aviso: " + res.message);
        }
      });
    });

    // 9. Eliminar Utilizador
    this.container.querySelectorAll(".btn-delete-user").forEach(btn => {
      btn.addEventListener("click", () => {
        const userId = btn.getAttribute("data-id");
        const u = authManager.getUser(userId);
        if (!u) return;

        if (confirm(`Tens a certeza de que desejas eliminar permanentemente o utilizador "${u.name}" (${u.email})?`)) {
          const res = authManager.deleteUser(userId);
          if (res.success) {
            soundEffects.playEncourage();
            alert(res.message);
            this.render();
          } else {
            alert("Erro: " + res.message);
          }
        }
      });
    });

    // 9. Formulário de Criação de Novo Utilizador
    const createForm = this.container.querySelector("#form-create-user");
    if (createForm) {
      // Ajusta checkboxes padrão ao mudar papel
      const roleSelect = this.container.querySelector("#create-role");
      roleSelect?.addEventListener("change", (e) => {
        const role = e.target.value;
        const defaults = authManager.getDefaultPermissions(role);
        this.container.querySelector("#perm-teacher-generator").checked = defaults.teacher_generator;
        this.container.querySelector("#perm-student-mode").checked = defaults.student_mode;
        this.container.querySelector("#perm-study-support").checked = defaults.study_support;
        this.container.querySelector("#perm-ai-settings").checked = defaults.ai_settings;
        this.container.querySelector("#perm-view-solutions").checked = defaults.view_solutions;
        this.container.querySelector("#perm-admin-panel").checked = defaults.admin_panel;
      });

      createForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = this.container.querySelector("#create-name").value.trim();
        const email = this.container.querySelector("#create-email").value.trim();
        const username = this.container.querySelector("#create-username").value.trim();
        const password = this.container.querySelector("#create-password").value.trim();
        const role = this.container.querySelector("#create-role").value;
        const title = this.container.querySelector("#create-title").value.trim();

        const permissions = {
          teacher_generator: this.container.querySelector("#perm-teacher-generator").checked,
          student_mode: this.container.querySelector("#perm-student-mode").checked,
          study_support: this.container.querySelector("#perm-study-support").checked,
          ai_settings: role === "admin",
          view_solutions: this.container.querySelector("#perm-view-solutions").checked,
          admin_panel: this.container.querySelector("#perm-admin-panel").checked,
          export_sheets: true
        };

        const res = authManager.createUser({ name, email, username, password, role, title, permissions });
        if (res.success) {
          soundEffects.playSuccess();
          alert(`Utilizador "${name}" criado com sucesso com os acessos atribuídos!`);
          this.activeTab = "users";
          this.render();
        } else {
          soundEffects.playEncourage();
          alert("Erro: " + res.message);
        }
      });

      this.container.querySelector("#btn-cancel-create")?.addEventListener("click", () => {
        this.activeTab = "users";
        this.render();
      });
    }

    // 10. Repor Utilizadores de Fábrica
    this.container.querySelector("#btn-reset-defaults")?.addEventListener("click", () => {
      if (confirm("Repor todos os utilizadores e permissões de fábrica?")) {
        authManager.resetToDefaults();
        soundEffects.playSuccess();
        alert("Utilizadores repostos com sucesso!");
        this.render();
      }
    });

    // 11. Exportar JSON
    this.container.querySelector("#btn-export-users")?.addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(authManager.getAllUsers(), null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `aprendamais_utilizadores_${new Date().toISOString().split("T")[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });
  }
}


// Modo Aluno Interativo Evoluído ("Aprende a Brincar com a Sofia")
// Inclui Mascote Animada em Tempo Real, Áudio Inteligente, Pistas da Sofia, Gamificação com Níveis e Diploma de Mérito Imprimível

class StudentMode {
  constructor(containerElement, onExit, onLogout) {
    this.container = containerElement;
    this.onExit = onExit;
    this.onLogout = onLogout;
    this.currentSheet = null;
    this.currentExerciseIndex = 0;
    this.score = {
      stars: 0,
      coins: 0,
      streak: 0,
      xp: 0,
      completedExercises: new Set()
    };
    this.selectedLeftMatch = null;
    this.matchedPairs = new Set();
    this.foundWords = new Set();
    this.activeHint = null;

    // Reage quando a Sofia está a falar para animar o bico/expressão
    sofiaVoice.onSpeakingStateChange = (speaking) => {
      const beak = document.getElementById("sofia-avatar-beak");
      const waves = document.getElementById("sofia-speech-waves");
      const avatarBox = document.getElementById("sofia-avatar-box");
      if (beak) {
        if (speaking) beak.classList.add("animate-pulse");
        else beak.classList.remove("animate-pulse");
      }
      if (waves) {
        if (speaking) waves.classList.remove("hidden");
        else waves.classList.add("hidden");
      }
      if (avatarBox) {
        if (speaking) avatarBox.classList.add("ring-4", "ring-yellow-300");
        else avatarBox.classList.remove("ring-4", "ring-yellow-300");
      }
    };
  }

  start(sheet) {
    this.currentSheet = sheet;
    this.currentExerciseIndex = 0;
    this.score.stars = 0;
    this.score.coins = 0;
    this.score.streak = 0;
    this.score.xp = 0;
    this.score.completedExercises.clear();
    this.selectedLeftMatch = null;
    this.matchedPairs.clear();
    this.foundWords.clear();
    this.activeHint = null;

    this.render();

    // Saudação de voz animada da Sofia ao iniciar a missão
    setTimeout(() => {
      sofiaVoice.speak(`Olá! Bem-vindo à missão: ${sheet.title}. Estou super pronta para te ajudar. Vamos começar?!`);
    }, 400);
  }

  _getPlayerLevel() {
    if (this.score.xp < 30) return { title: "Pequeno Aprendiz 🌱", rank: 1, next: 30 };
    if (this.score.xp < 70) return { title: "Explorador Curioso 🧭", rank: 2, next: 70 };
    if (this.score.xp < 120) return { title: "Detetive do Saber 🔍", rank: 3, next: 120 };
    if (this.score.xp < 200) return { title: "Génio da Turma 🚀", rank: 4, next: 200 };
    return { title: "Mestre Supremo das Letras e Números 👑", rank: 5, next: 300 };
  }

  render() {
    if (!this.currentSheet) return;

    const currentEx = this.currentSheet.exercises[this.currentExerciseIndex];
    const totalExercises = this.currentSheet.exercises.length;
    const progressPercent = Math.round(((this.currentExerciseIndex + 1) / totalExercises) * 100);
    const levelInfo = this._getPlayerLevel();

    this.container.innerHTML = `
      <div class="max-w-5xl mx-auto px-4 py-6 font-sans">
        
        <!-- Barra de Topo do Aluno: Mascote Sofia, Estatísticas e Nível -->
        <div class="bg-gradient-to-r from-amber-400 via-pink-400 to-purple-600 p-5 rounded-3xl shadow-xl text-white mb-6 flex flex-wrap items-center justify-between gap-4 relative overflow-hidden">
          
          <!-- Mascote Sofia Interativa -->
          <div class="flex items-center gap-4 z-10">
            <div id="sofia-avatar-box" class="w-16 h-16 sm:w-20 sm:h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-4xl shadow-inner relative transform hover:scale-105 transition cursor-pointer select-none" title="Clica para ouvir a Sofia!">
              <span id="sofia-avatar-emoji">🦉</span>
              <span id="sofia-avatar-beak" class="absolute bottom-2 text-xs">✨</span>
              <div id="sofia-speech-waves" class="hidden absolute -top-1 -right-1 flex gap-0.5">
                <span class="w-1.5 h-3 bg-white rounded-full animate-bounce"></span>
                <span class="w-1.5 h-4 bg-yellow-300 rounded-full animate-bounce delay-75"></span>
                <span class="w-1.5 h-2 bg-white rounded-full animate-bounce delay-150"></span>
              </div>
            </div>

            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs uppercase tracking-wider font-extrabold text-amber-100">Amiga de Estudo Virtual</span>
                <button id="btn-open-voice-studio" class="px-2.5 py-0.5 rounded-full bg-white/20 hover:bg-white/30 text-[11px] font-black transition flex items-center gap-1 shadow-sm">
                  <span>🎙️</span> Mudar Voz
                </button>
              </div>
              <h2 class="text-xl sm:text-2xl font-black flex items-center gap-2">
                Sofia a Corujinha
                <button id="btn-read-mascot-speech" class="p-1.5 bg-white/30 hover:bg-white/40 rounded-full transition text-sm" title="Ouvir a Sofia falar">
                  🔊
                </button>
              </h2>
              <div class="text-xs font-bold text-amber-200 mt-0.5 flex items-center gap-2">
                <span>${levelInfo.title}</span>
                <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">Nível ${levelInfo.rank}</span>
              </div>
            </div>
          </div>

          <!-- Placar: Estrelas, Moedas e Combo Streak -->
          <div class="flex items-center gap-3 z-10 flex-wrap">
            <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center gap-2 font-black text-sm sm:text-base shadow-sm">
              <span class="text-yellow-300 text-2xl">⭐</span>
              <span id="star-count">${this.score.stars}</span>
            </div>

            <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center gap-2 font-black text-sm sm:text-base shadow-sm">
              <span class="text-amber-200 text-2xl">🪙</span>
              <span id="coin-count">${this.score.coins}</span>
            </div>

            ${this.score.streak >= 2 ? `
              <div class="bg-gradient-to-r from-orange-500 to-red-500 px-3.5 py-2 rounded-2xl flex items-center gap-1.5 font-black text-xs sm:text-sm animate-pulse shadow-lg">
                <span>🔥</span>
                <span>Combo x${this.score.streak}!</span>
              </div>
            ` : ""}

            <button id="btn-exit-student-mode" class="bg-white text-purple-900 hover:bg-purple-50 font-black px-4 py-2 rounded-2xl text-xs sm:text-sm transition shadow-md">
              Voltar ✕
            </button>

            <button id="btn-student-logout" class="bg-white/20 hover:bg-white/30 text-white font-bold px-3 py-2 rounded-2xl text-xs transition flex items-center gap-1" title="Terminar Sessão">
              <span>🚪</span> Sair
            </button>
          </div>
        </div>

        <!-- Barra de Progresso e XP -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border-2 border-purple-100 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="w-full sm:flex-1">
            <div class="flex justify-between items-center text-xs font-black text-purple-900 mb-1.5">
              <span>Missão: ${this.currentSheet.title}</span>
              <span>Pergunta ${this.currentExerciseIndex + 1} de ${totalExercises}</span>
            </div>
            <div class="w-full bg-purple-100 rounded-full h-3.5 overflow-hidden p-0.5">
              <div class="bg-gradient-to-r from-emerald-400 via-teal-400 to-indigo-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
            </div>
          </div>
          <div class="text-xs font-bold text-slate-500 flex items-center gap-1.5 flex-shrink-0">
            <span>✨ XP:</span>
            <span class="text-purple-700 font-black text-sm">${this.score.xp} pts</span>
          </div>
        </div>

        <!-- Cartão Principal do Exercício Interativo -->
        <div id="exercise-interactive-card" class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border-4 border-amber-200 relative overflow-hidden transition-all">
          
          <!-- Cabeçalho do Exercício com Botão de Leitura e Botão de Pista -->
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-6">
            <div class="flex items-start gap-3 flex-1">
              <span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-500 text-white flex items-center justify-center font-black text-xl shadow flex-shrink-0">
                ${currentEx.number}
              </span>
              <div>
                <h3 class="text-xl sm:text-2xl font-black text-slate-800 leading-snug">
                  ${currentEx.prompt}
                </h3>
              </div>
            </div>

            <!-- Ações da Questão: Ler e Pedir Pista -->
            <div class="flex items-center gap-2 flex-shrink-0 self-end sm:self-auto">
              <button id="btn-ask-hint" class="bg-purple-100 hover:bg-purple-200 text-purple-900 px-3.5 py-2.5 rounded-2xl transition flex items-center gap-1.5 font-black text-xs shadow-sm transform active:scale-95" title="Pedir uma pista à Sofia">
                <span>💡</span>
                <span>Pista</span>
              </button>

              <button id="btn-speak-question" class="bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white px-4 py-2.5 rounded-2xl transition flex items-center gap-2 font-black text-xs sm:text-sm shadow-md transform hover:scale-105 active:scale-95" title="Ouvir a pergunta com a voz da Sofia">
                <span>🔊</span>
                <span>Lê para mim!</span>
              </button>
            </div>
          </div>

          <!-- Pista da Sofia (se solicitada) -->
          ${this.activeHint ? `
            <div class="mb-6 p-4 bg-purple-50 rounded-2xl border-2 border-purple-200 flex items-start gap-3 text-xs sm:text-sm text-purple-950 font-bold animate-fade-in">
              <span class="text-2xl flex-shrink-0">🦉</span>
              <div class="flex-1">
                <span class="font-black uppercase text-[10px] text-purple-700 block mb-0.5">Dica Amiga da Sofia:</span>
                ${this.activeHint}
              </div>
              <button id="btn-speak-hint" class="text-purple-700 hover:text-purple-900 font-black text-xs flex items-center gap-1 p-1">
                <span>🔊</span>
              </button>
            </div>
          ` : ""}

          ${currentEx.visualAid ? `
            <div class="bg-amber-50/70 rounded-2xl p-6 text-center text-3xl sm:text-4xl my-4 tracking-widest border border-amber-200 select-none">
              ${currentEx.visualAid}
            </div>
          ` : ""}

          <!-- Área Específica por Tipo de Exercício -->
          <div id="interactive-content" class="my-6">
            ${this._renderExerciseContent(currentEx)}
          </div>

          <!-- Mensagem de Feedback Animada -->
          <div id="feedback-alert" class="hidden mb-6 p-4 rounded-2xl font-black text-center text-base transition-all transform scale-95"></div>

          <!-- Rodapé de Navegação do Exercício -->
          <div class="flex items-center justify-between pt-6 border-t border-slate-100">
            <button id="btn-prev-ex" class="px-5 py-2.5 rounded-2xl text-slate-500 font-bold hover:bg-slate-100 transition flex items-center gap-1.5 ${this.currentExerciseIndex === 0 ? "opacity-30 cursor-not-allowed" : ""}" ${this.currentExerciseIndex === 0 ? "disabled" : ""}>
              <span>←</span>
              <span>Anterior</span>
            </button>

            <button id="btn-next-ex" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg transition flex items-center gap-2 transform hover:scale-105 active:scale-95">
              <span>${this.currentExerciseIndex === totalExercises - 1 ? "Concluir Missão! 🎓" : "Próxima Pergunta →"}</span>
            </button>
          </div>
        </div>

      </div>
    `;

    this._bindEvents(currentEx);
  }

  _renderExerciseContent(ex) {
    if (ex.type === "multiple-choice") {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${ex.options.map((opt, i) => `
            <button class="btn-mc-option w-full text-left p-5 rounded-2xl border-3 border-slate-200 hover:border-amber-400 hover:bg-amber-50/50 transition font-black text-base sm:text-lg text-slate-800 flex items-center gap-4 group shadow-sm transform active:scale-98" data-index="${i}">
              <span class="w-9 h-9 rounded-xl border-2 border-slate-300 group-hover:border-amber-500 flex items-center justify-center text-sm font-black text-slate-400 group-hover:text-amber-600 bg-slate-50 group-hover:bg-white flex-shrink-0">
                ${String.fromCharCode(65 + i)}
              </span>
              <span class="flex-1">${opt.text}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    if (ex.type === "match-columns") {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-3">
            <h4 class="text-xs uppercase font-extrabold text-blue-800 tracking-wider">1. Clica no item da esquerda:</h4>
            ${ex.left.map(item => `
              <button class="btn-match-left w-full text-left p-4 rounded-2xl border-2 border-blue-200 bg-blue-50/60 hover:bg-blue-100 font-extrabold text-slate-800 transition flex items-center justify-between" data-id="${item.id}">
                <span>${item.label}</span>
                <span class="w-6 h-6 rounded-full border-2 border-blue-400 bg-white flex items-center justify-center text-xs text-blue-600 font-black indicator"></span>
              </button>
            `).join("")}
          </div>
          <div class="space-y-3">
            <h4 class="text-xs uppercase font-extrabold text-emerald-800 tracking-wider">2. Clica no par correspondente:</h4>
            ${ex.right.map(item => `
              <button class="btn-match-right w-full text-left p-4 rounded-2xl border-2 border-emerald-200 bg-emerald-50/60 hover:bg-emerald-100 font-extrabold text-slate-800 transition flex items-center justify-between" data-id="${item.id}" data-match="${item.matchWith}">
                <span>${item.label}</span>
                <span class="w-6 h-6 rounded-full border-2 border-emerald-400 bg-white flex items-center justify-center text-xs text-emerald-600 font-black indicator"></span>
              </button>
            `).join("")}
          </div>
        </div>
        <div id="match-status" class="mt-4 text-center font-bold text-xs text-slate-500">
          Liga todos os pares para ganhar estrelas e moedas mágicas da Sofia!
        </div>
      `;
    }

    if (ex.type === "fill-blanks") {
      return `
        <div class="space-y-6">
          ${ex.wordBank ? `
            <div class="bg-purple-50 border-2 border-purple-200 p-4 rounded-2xl">
              <div class="text-xs font-black text-purple-700 uppercase mb-2">Banco de Palavras Mágicas (Clica numa palavra para preencher):</div>
              <div class="flex flex-wrap gap-2">
                ${ex.wordBank.map(w => `
                  <button type="button" class="btn-word-chip bg-white border-2 border-purple-300 text-purple-900 font-black px-4 py-2 rounded-xl shadow-sm hover:bg-purple-600 hover:text-white transition transform active:scale-95" data-word="${w}">
                    ${w}
                  </button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div class="space-y-4">
            ${ex.clues.map((clue, idx) => `
              <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex flex-wrap items-center gap-3 text-base sm:text-lg font-bold">
                <span>${clue.text.split("____")[0]}</span>
                <input type="text" class="input-blank-answer px-3 py-1.5 rounded-xl border-2 border-amber-300 text-center font-black text-amber-800 w-44 uppercase bg-white focus:outline-none focus:border-amber-500" data-answer="${clue.blankAnswer}" placeholder="Escreve aqui...">
                <span>${clue.text.split("____")[1] || ""}</span>
                <button type="button" class="btn-check-blank bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3.5 py-2 rounded-xl font-black shadow transition">
                  Verificar ✓
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    if (ex.type === "math-grid") {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          ${ex.operations.map((op, idx) => `
            <div class="bg-slate-50 border-2 border-slate-300 rounded-2xl p-5 text-center shadow-sm">
              <div class="flex justify-around text-xs font-black text-slate-400 mb-2 border-b pb-1">
                <span>C</span><span>D</span><span>U</span>
              </div>
              <div class="text-3xl font-black tracking-widest text-slate-800 mb-1">
                ${op.num1}
              </div>
              <div class="text-3xl font-black tracking-widest text-slate-800 flex justify-between px-4">
                <span class="text-amber-600 font-black">${op.operator}</span>
                <span>${op.num2}</span>
              </div>
              <div class="border-b-4 border-slate-800 my-3"></div>
              <input type="number" class="input-math-answer w-full text-center text-3xl font-black p-2.5 rounded-xl border-2 border-amber-400 bg-white text-slate-900" data-answer="${op.answer}" placeholder="?">
              <button type="button" class="btn-check-math mt-3 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-2 rounded-xl text-xs transition shadow">
                Validar Resultado
              </button>
            </div>
          `).join("")}
        </div>
      `;
    }

    if (ex.type === "word-search") {
      return `
        <div class="flex flex-col md:flex-row items-center justify-center gap-8">
          <div class="bg-slate-100 p-4 rounded-3xl border-2 border-slate-300 shadow-inner">
            <div class="grid gap-1.5 select-none" style="grid-template-columns: repeat(${ex.grid[0].length}, minmax(0, 1fr));">
              ${ex.grid.map((row, r) => row.map((cell, c) => `
                <button type="button" class="btn-ws-cell w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-white hover:bg-amber-100 border border-slate-200 font-black text-base sm:text-lg text-slate-800 flex items-center justify-center transition shadow-sm" data-r="${r}" data-c="${c}" data-letter="${cell}">
                  ${cell}
                </button>
              `).join("")).join("")}
            </div>
          </div>

          <div class="bg-amber-50 p-6 rounded-3xl border-2 border-amber-200 max-w-xs w-full text-center">
            <h4 class="font-black text-amber-900 uppercase text-xs mb-3">Palavras para Encontrar:</h4>
            <div class="space-y-2 font-mono font-bold text-sm">
              ${ex.wordsToFind.map(w => `
                <div class="p-2 rounded-xl bg-white border border-amber-200 text-slate-700 flex items-center justify-between ws-word-item" data-word="${w}">
                  <span>🔍 ${w}</span>
                  <span class="ws-check text-xs font-black text-emerald-600 hidden">✓ Encontrada!</span>
                </div>
              `).join("")}
            </div>
            <p class="text-[11px] text-amber-800 mt-4 font-bold">
              Clica nas letras no tabuleiro para marcar as palavras!
            </p>
          </div>
        </div>
      `;
    }

    // Default: Caligrafia e Expressão Escrita
    return `
      <div class="text-center p-8 bg-amber-50/50 rounded-3xl border-2 border-dashed border-amber-300">
        <p class="text-lg font-black text-slate-800 mb-2">
          Exercício de Caligrafia e Pensamento Criativo!
        </p>
        <p class="text-slate-600 font-medium italic mb-6">
          "${ex.textToCopy || ex.prompt}"
        </p>
        <button id="btn-self-complete" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black px-8 py-3.5 rounded-2xl shadow-lg transition transform hover:scale-105 active:scale-95">
          Já fiz com letra bonita! ⭐ Ganhar Estrelas
        </button>
      </div>
    `;
  }

  _bindEvents(ex) {
    // 1. Abrir Estúdio de Voz da Sofia
    document.getElementById("btn-open-voice-studio")?.addEventListener("click", () => {
      sofiaVoice.openVoiceModal();
    });

    // 2. Falar Saudação da Mascote
    document.getElementById("btn-read-mascot-speech")?.addEventListener("click", () => {
      sofiaVoice.speak("Olá amiguinho! Eu sou a Sofia. Estou super contente por estudar contigo. Dá o teu melhor!");
    });

    document.getElementById("sofia-avatar-box")?.addEventListener("click", () => {
      sofiaVoice.speak("Tu és muito inteligente! Vamos continuar com energia!");
    });

    // 3. Falar a Pergunta com a Voz da Sofia
    document.getElementById("btn-speak-question")?.addEventListener("click", () => {
      sofiaVoice.speak(ex.prompt);
    });

    // 4. Pedir Pista à Sofia
    document.getElementById("btn-ask-hint")?.addEventListener("click", () => {
      this.activeHint = this._generateHintForExercise(ex);
      this.render();
      setTimeout(() => {
        sofiaVoice.speak("Aqui está uma pista amiga: " + this.activeHint);
      }, 150);
    });

    document.getElementById("btn-speak-hint")?.addEventListener("click", () => {
      if (this.activeHint) sofiaVoice.speak(this.activeHint);
    });

    // 5. Sair do Modo Aluno
    document.getElementById("btn-exit-student-mode")?.addEventListener("click", () => {
      sofiaVoice.stop();
      if (this.onExit) this.onExit();
    });

    document.getElementById("btn-student-logout")?.addEventListener("click", () => {
      sofiaVoice.stop();
      if (this.onLogout) this.onLogout();
    });

    // 6. Navegação Anterior
    document.getElementById("btn-prev-ex")?.addEventListener("click", () => {
      if (this.currentExerciseIndex > 0) {
        this.currentExerciseIndex--;
        this.activeHint = null;
        this.render();
      }
    });

    // 7. Próxima Pergunta / Concluir
    document.getElementById("btn-next-ex")?.addEventListener("click", () => {
      if (this.currentExerciseIndex < this.currentSheet.exercises.length - 1) {
        this.currentExerciseIndex++;
        this.activeHint = null;
        this.render();
      } else {
        this._showCelebrationModal();
      }
    });

    // 8. Escolha Múltipla com Resposta e Voz Animada
    if (ex.type === "multiple-choice") {
      document.querySelectorAll(".btn-mc-option").forEach(btn => {
        btn.addEventListener("click", () => {
          const optIdx = parseInt(btn.getAttribute("data-index"), 10);
          const option = ex.options[optIdx];
          const feedback = document.getElementById("feedback-alert");

          if (option.isCorrect) {
            btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-900");
            soundEffects.playSuccess();
            this._awardPoints(1, 10, 20);
            this.score.streak++;

            feedback.className = "mb-6 p-4 rounded-2xl font-black text-center text-base bg-emerald-100 text-emerald-800 border-2 border-emerald-300 block animate-bounce";
            feedback.innerHTML = "🎉 Resposta Certíssima! Ganhaste uma estrela e moedas mágicas!";
            
            sofiaVoice.speakPraise();
          } else {
            btn.classList.add("bg-red-50", "border-red-400", "text-red-800");
            soundEffects.playEncourage();
            this.score.streak = 0;

            feedback.className = "mb-6 p-4 rounded-2xl font-black text-center text-base bg-amber-100 text-amber-900 border-2 border-amber-300 block";
            feedback.innerHTML = "Quase lá! Tenta outra vez com calma. A Sofia acredita em ti! 😊";

            sofiaVoice.speakEncouragement();
          }
          this._updateScoresUI();
        });
      });
    }

    // 9. Ligar Colunas
    if (ex.type === "match-columns") {
      let selectedLeftBtn = null;

      document.querySelectorAll(".btn-match-left").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".btn-match-left").forEach(b => b.classList.remove("ring-4", "ring-blue-400"));
          btn.classList.add("ring-4", "ring-blue-400");
          selectedLeftBtn = btn;
        });
      });

      document.querySelectorAll(".btn-match-right").forEach(btn => {
        btn.addEventListener("click", () => {
          if (!selectedLeftBtn) {
            sofiaVoice.speak("Clica primeiro num elemento do lado esquerdo!");
            return;
          }

          const leftId = selectedLeftBtn.getAttribute("data-id");
          const expectedLeftId = btn.getAttribute("data-match");

          if (leftId === expectedLeftId) {
            selectedLeftBtn.classList.remove("ring-4", "ring-blue-400");
            selectedLeftBtn.classList.add("bg-emerald-200", "border-emerald-500", "text-emerald-950", "pointer-events-none");
            selectedLeftBtn.querySelector(".indicator").innerText = "✓";
            selectedLeftBtn.querySelector(".indicator").classList.add("bg-emerald-500", "text-white");

            btn.classList.add("bg-emerald-200", "border-emerald-500", "text-emerald-950", "pointer-events-none");
            btn.querySelector(".indicator").innerText = "✓";
            btn.querySelector(".indicator").classList.add("bg-emerald-500", "text-white");

            soundEffects.playSuccess();
            this._awardPoints(1, 10, 15);
            sofiaVoice.speak("Par ligado com sucesso!");
            selectedLeftBtn = null;
            this._updateScoresUI();
          } else {
            soundEffects.playEncourage();
            sofiaVoice.speak("Esses dois não combinam. Experimenta outra opção!");
          }
        });
      });
    }

    // 10. Preenchimento de Espaços com Banco de Palavras Clicáveis
    if (ex.type === "fill-blanks") {
      let activeBlankInput = null;

      document.querySelectorAll(".input-blank-answer").forEach(input => {
        input.addEventListener("focus", () => {
          activeBlankInput = input;
        });
      });

      document.querySelectorAll(".btn-word-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const word = chip.getAttribute("data-word");
          soundEffects.playCardFlip();
          
          if (!activeBlankInput) {
            // Encontra o primeiro campo vazio
            const inputs = Array.from(document.querySelectorAll(".input-blank-answer"));
            activeBlankInput = inputs.find(i => !i.value.trim()) || inputs[0];
          }

          if (activeBlankInput) {
            activeBlankInput.value = word;
            activeBlankInput.focus();
          }
        });
      });

      document.querySelectorAll(".btn-check-blank").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const parent = e.target.closest("div");
          const input = parent.querySelector(".input-blank-answer");
          const expected = input.getAttribute("data-answer").toLowerCase().trim();
          const given = input.value.toLowerCase().trim();

          if (given === expected || expected.includes(given)) {
            input.classList.remove("border-amber-300");
            input.classList.add("border-emerald-500", "bg-emerald-100", "text-emerald-900");
            btn.innerText = "Certo! ⭐";
            btn.classList.remove("bg-emerald-500");
            btn.classList.add("bg-emerald-700", "pointer-events-none");
            soundEffects.playSuccess();
            this._awardPoints(1, 10, 20);
            sofiaVoice.speak("Palavra certíssima!");
            this._updateScoresUI();
          } else {
            input.classList.add("border-red-400", "bg-red-50");
            soundEffects.playEncourage();
            sofiaVoice.speak("Ainda não está certo. Tenta outra palavra!");
          }
        });
      });
    }

    // 11. Contas Armadas (C | D | U)
    if (ex.type === "math-grid") {
      document.querySelectorAll(".btn-check-math").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const parent = e.target.closest("div");
          const input = parent.querySelector(".input-math-answer");
          const expected = parseInt(input.getAttribute("data-answer"), 10);
          const given = parseInt(input.value, 10);

          if (given === expected) {
            input.classList.add("border-emerald-500", "bg-emerald-100", "text-emerald-900");
            btn.innerText = "Correto! ⭐";
            btn.classList.remove("bg-emerald-500");
            btn.classList.add("bg-emerald-700", "pointer-events-none");
            soundEffects.playSuccess();
            this._awardPoints(1, 10, 20);
            sofiaVoice.speak("Resultado matemático impecável!");
            this._updateScoresUI();
          } else {
            input.classList.add("border-red-500", "bg-red-50");
            soundEffects.playEncourage();
            sofiaVoice.speak("O cálculo não deu certo. Revê as unidades e dezenas com calma!");
          }
        });
      });
    }

    // 12. Sopa de Letras Interativa
    if (ex.type === "word-search") {
      document.querySelectorAll(".btn-ws-cell").forEach(cell => {
        cell.addEventListener("click", () => {
          cell.classList.toggle("bg-amber-300");
          cell.classList.toggle("text-amber-950");
          cell.classList.toggle("ring-2");
          cell.classList.toggle("ring-amber-500");
          soundEffects.playSuccess();
        });
      });
    }

    // 13. Caligrafia
    document.getElementById("btn-self-complete")?.addEventListener("click", () => {
      soundEffects.playSuccess();
      this._awardPoints(2, 20, 30);
      sofiaVoice.speak("Que letra bonita e caprichada! Parabéns pelo teu esforço!");
      this._updateScoresUI();
      document.getElementById("btn-self-complete").outerHTML = `
        <div class="text-emerald-700 font-black text-xl py-4 bg-emerald-50 rounded-2xl border border-emerald-300">
          ⭐ Excelente trabalho com a tua caligrafia!
        </div>
      `;
    });
  }

  _generateHintForExercise(ex) {
    if (ex.type === "multiple-choice") {
      const correctOpt = ex.options.find(o => o.isCorrect);
      if (correctOpt) {
        return `Presta atenção: a resposta certa fala sobre "${correctOpt.text.substring(0, 20)}...". Lê as opções com calma!`;
      }
    }
    if (ex.type === "math-grid") {
      return "Começa a calcular SEMPRE pelas Unidades na coluna da direita! Se a soma der dez ou mais, lembra-te do transporte para a coluna das Dezenas.";
    }
    if (ex.type === "match-columns") {
      return "Lê um elemento de cada vez. Tenta associar cada palavra ao seu significado ou par correspondente.";
    }
    if (ex.type === "fill-blanks") {
      return "Olha para o Banco de Palavras Mágicas no topo! Lê a frase em voz alta e descobre que palavra soa melhor no espaço vazio.";
    }
    if (ex.type === "word-search") {
      return "Procura a primeira letra de cada palavra nas linhas horizontais ou verticais. Anda com o dedinho linha a linha!";
    }
    return "Pensa com calma no que aprendeste nas aulas e escreve com a tua melhor letra!";
  }

  _awardPoints(stars, coins, xp) {
    this.score.stars += stars;
    this.score.coins += coins;
    this.score.xp += xp;
  }

  _updateScoresUI() {
    const starEl = document.getElementById("star-count");
    const coinEl = document.getElementById("coin-count");
    if (starEl) starEl.innerText = this.score.stars;
    if (coinEl) coinEl.innerText = this.score.coins;
  }

  _showCelebrationModal() {
    soundEffects.playVictoryFanfare();

    if (typeof confetti === "function") {
      confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
    }

    sofiaVoice.speak("Parabéns campeão! Concluíste toda a missão de estudo com sucesso! O teu diploma de mérito escolar está pronto para imprimir!");

    const studentName = this.currentSheet.schoolHeader?.studentName || "Pequeno Grande Aluno";
    const today = new Date().toLocaleDateString("pt-PT");
    const yearLabel = `${this.currentSheet.year || 1}º Ano`;

    const modal = document.createElement("div");
    modal.className = "fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-sans overflow-y-auto";
    modal.innerHTML = `
      <div class="bg-white rounded-3xl p-6 sm:p-10 max-w-2xl w-full text-center shadow-2xl border-4 border-amber-300 transform scale-100 animate-fade-in my-8">
        
        <!-- DIPLOMA DE MÉRITO ESCOLAR IMPRIMÍVEL -->
        <div id="diploma-printable-area" class="border-4 border-double border-amber-500 rounded-3xl p-6 sm:p-10 bg-gradient-to-b from-amber-50/60 via-white to-purple-50/40 relative shadow-sm">
          <div class="text-6xl mb-2 animate-bounce">🎓</div>
          <div class="text-xs font-black uppercase tracking-widest text-amber-800 mb-1">República Portuguesa • 1º Ciclo do Ensino Básico</div>
          <h2 class="text-2xl sm:text-3xl font-black text-purple-950 tracking-tight mb-2">DIPLOMA DE MÉRITO ESCOLAR</h2>
          <p class="text-xs text-slate-500 font-bold mb-3">Certifica-se com grande orgulho e distinção que o(a) aluno(a):</p>
          
          <input type="text" id="input-diploma-name" value="${studentName}" class="text-2xl sm:text-3xl font-black text-center text-blue-900 border-b-2 border-dashed border-blue-400 bg-transparent outline-none w-full mb-3 focus:border-blue-600" placeholder="Escreve o teu nome aqui">
          
          <p class="text-slate-700 text-xs sm:text-sm font-bold max-w-md mx-auto leading-relaxed mb-6">
            Concluiu com dedicação, brilhantismo e nota máxima a missão de estudo: <br>
            <strong class="text-indigo-900 font-black">"${this.currentSheet.title}"</strong> (${yearLabel}).
          </p>

          <div class="flex justify-center gap-4 sm:gap-6 mb-6">
            <div class="bg-amber-100 px-5 py-3 rounded-2xl border border-amber-300">
              <div class="text-2xl">⭐</div>
              <div class="text-xl font-black text-amber-900">${this.score.stars}</div>
              <div class="text-[10px] font-bold text-amber-700">Estrelas</div>
            </div>
            <div class="bg-yellow-100 px-5 py-3 rounded-2xl border border-yellow-300">
              <div class="text-2xl">🪙</div>
              <div class="text-xl font-black text-yellow-900">${this.score.coins}</div>
              <div class="text-[10px] font-bold text-yellow-700">Moedas</div>
            </div>
            <div class="bg-purple-100 px-5 py-3 rounded-2xl border border-purple-300">
              <div class="text-2xl">✨</div>
              <div class="text-xl font-black text-purple-900">${this.score.xp}</div>
              <div class="text-[10px] font-bold text-purple-700">Pontos XP</div>
            </div>
          </div>

          <div class="flex justify-between items-end pt-5 border-t border-slate-300 text-[11px] font-bold text-slate-500">
            <div>Data: ${today}</div>
            <div class="flex items-center gap-1.5 text-purple-900 font-black">
              <span>🦉 Sofia a Corujinha (Tutora Oficial)</span>
            </div>
          </div>
        </div>

        <!-- Botoeira do Modal -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6">
          <button id="btn-print-diploma" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 transform active:scale-95">
            <span>🖨️</span> Imprimir Diploma (A4)
          </button>
          <button id="btn-replay-mission" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 transform active:scale-95">
            <span>🔄</span> Repetir Missão
          </button>
          <button id="btn-exit-modal" class="bg-purple-100 hover:bg-purple-200 text-purple-900 font-black py-3 rounded-2xl transition">
            Voltar ao Painel ✕
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    modal.querySelector("#btn-print-diploma").addEventListener("click", () => {
      document.body.classList.add("printing-diploma");
      window.print();
      setTimeout(() => {
        document.body.classList.remove("printing-diploma");
      }, 1000);
    });

    modal.querySelector("#btn-replay-mission").addEventListener("click", () => {
      modal.remove();
      this.start(this.currentSheet);
    });

    modal.querySelector("#btn-exit-modal").addEventListener("click", () => {
      modal.remove();
      if (this.onExit) this.onExit();
    });
  }
}


// Centro de Apoio ao Estudo & Tutor Inteligente (1º ao 4º Ano)
// Inclui Resumos Ilustrados, Flashcards com Autoavaliação, Pomodoro Interativo e Tutor de Dúvidas

class StudySupport {
  constructor(containerElement, onBackToTeacher, onLogout) {
    this.container = containerElement;
    this.onBackToTeacher = onBackToTeacher;
    this.onLogout = onLogout;
    this.selectedSubject = "portugues";

    // Deteta se o utilizador é professor ou admin
    const currentUser = (typeof window !== "undefined" && window.authManager) ? window.authManager.getCurrentUser() : null;
    this.isTeacher = currentUser ? (currentUser.role === "teacher" || currentUser.role === "admin") : true;
    this.selectedTab = this.isTeacher ? "ia_cockpit" : "flashcards"; // Se for professor, abre logo na Janela de IA!
    this.generatedTestContent = null;
    this.activeCardIndex = 0;
    this.isFlipped = false;
    this.masteredCards = new Set(); // Guarda IDs dos cartões dominados

    // Estado do Pomodoro
    this.pomodoro = {
      minutes: 15,
      seconds: 0,
      initialMinutes: 15,
      isRunning: false,
      isBreak: false,
      intervalId: null,
      sessionsCompleted: parseInt(localStorage.getItem("sofia_pomodoro_sessions") || "0", 10)
    };

    // Estado do Tutor
    this.tutorSearchQuery = "";
    this.tutorFilterSubject = "all";
    this.customAnswer = null;

    // Resumo Completo Modal
    this.activeSummaryModalSubject = null;
  }

  start() {
    this.render();
  }

          <div class="flex items-center gap-4 z-10">
            <div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-4xl shadow-inner animate-bounce select-none">
              🦉
            </div>
            <div>
              <span class="bg-white/20 text-teal-100 font-extrabold text-xs px-3 py-1 rounded-full uppercase tracking-wider">
                1º Ciclo do Ensino Básico • Portugal
              </span>
              <h1 class="text-2xl sm:text-3xl font-black tracking-tight mt-1">
                Centro de Apoio ao Estudo & Tutor da Sofia
              </h1>
              <p class="text-teal-100 text-xs sm:text-sm mt-0.5">
                Resumos ilustrados, flashcards inteligentes, temporizador de foco e tutor de dúvidas!
              </p>
            </div>
          </div>

          <div class="flex items-center gap-3 z-10">
            <button id="btn-listen-welcome" class="bg-white/20 hover:bg-white/30 text-white font-black px-4 py-2.5 rounded-2xl text-xs sm:text-sm backdrop-blur-sm transition flex items-center gap-2 transform active:scale-95 shadow-sm">
              <span>🔊</span> Ouvir a Sofia
            </button>
            <button id="btn-back-to-teacher" class="bg-white text-teal-900 hover:bg-teal-50 font-black px-5 py-2.5 rounded-2xl text-xs sm:text-sm shadow-md transition transform active:scale-95">
              Voltar ✕
            </button>
            <button id="btn-support-logout" class="bg-white/20 hover:bg-white/30 text-white font-black px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm backdrop-blur-sm transition flex items-center gap-1.5" title="Terminar Sessão">
              <span>🚪</span> Sair
            </button>
          </div>
        </div>

        <!-- Abas de Navegação do Apoio ao Estudo -->

  _renderActiveTabContent(currentCard, cards) {
    if (this.selectedTab === "ia_cockpit") {

    }
    if (this.selectedTab === "radar") {
      return this._renderRadarTab();
    }
    if (this.selectedTab === "cdu") {
      return this._renderCDUTab();
    }
    if (this.selectedTab === "leitura_dua") {
      return this._renderLeituraDUATab();
    }
    if (this.selectedTab === "flashcards") {
      return this._renderFlashcardsTab(currentCard, cards);

    if (this.selectedTab === "pomodoro") {
      return this._renderPomodoroTab();
    }
    if (this.selectedTab === "tutor") {
      return this._renderTutorTab();
    }
    return this._renderMethodsTab();
  }

    return `
      <!-- Seletor de Disciplinas (Todas as 6) -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 mb-6">
        ${CURRICULUM_PT.subjects.map(s => `
          <button class="btn-select-support-sub p-3 rounded-2xl border text-xs font-black transition flex flex-col items-center gap-1.5 ${this.selectedSubject === s.id ? "bg-teal-50 border-teal-500 text-teal-900 ring-2 ring-teal-200 shadow" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"}" data-subject="${s.id}">
            <span class="text-2xl">${s.emoji}</span>
            <span class="truncate text-center w-full">${s.name}</span>
          </button>
        `).join("")}
      </div>

      <!-- Barra de Ferramentas dos Cartões: Progresso e Botão de Resumo Completo -->
      <div class="max-w-2xl mx-auto mb-4 flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex items-center gap-2 text-xs font-bold text-slate-600">
          <span class="text-amber-500 text-base">⭐</span>
          <span>Domínio da Disciplina:</span>
          <span class="bg-teal-100 text-teal-800 font-black px-2.5 py-0.5 rounded-full text-xs">
            ${masteredCount} de ${cards.length} cartões dominados
          </span>
        </div>

        <button id="btn-open-full-summary" class="bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5">
          <span>📄</span>
          <span>Ver Ficha de Resumo Ilustrada</span>
        </button>
      </div>

      <!-- Área do Cartão / Flashcard Interativo -->
      ${currentCard ? `
        <div class="max-w-2xl mx-auto">
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2 px-2">
            <span>Cartão ${this.activeCardIndex + 1} de ${cards.length} • ${currentCard.badge}</span>
            <span class="text-teal-600 font-black">Clica no cartão para virar! 🔄</span>
          </div>

          <!-- Cartão Principal com Flip 3D -->
          <div id="interactive-flashcard" class="bg-white rounded-3xl p-7 sm:p-10 shadow-xl border-4 ${this.isFlipped ? "border-emerald-400 bg-emerald-50/20" : "border-teal-400"} min-h-[300px] flex flex-col justify-between cursor-pointer transition transform hover:scale-[1.01] select-none relative">
            <div>
              <div class="flex justify-between items-start mb-4">
                <span class="bg-teal-100 text-teal-900 text-xs font-black px-3.5 py-1.5 rounded-full uppercase tracking-wider flex items-center gap-1.5">
                  <span>${this.isFlipped ? "💡 Explicação Completa" : "❓ Tópico de Estudo"}</span>
                  ${isMastered ? `<span class="text-emerald-700 font-black">✓ Já Dominado</span>` : ""}
                </span>
                
                <button id="btn-speak-card" class="bg-teal-50 hover:bg-teal-100 text-teal-700 p-2.5 rounded-2xl transition flex items-center gap-1.5 font-black text-xs shadow-sm" title="Ouvir a Sofia ler">
                  <span>🔊</span> Ouvir Sofia
                </button>
              </div>
              
              <h3 class="text-xl sm:text-2xl font-black text-slate-800 leading-snug mt-2">
                ${this.isFlipped ? currentCard.back : currentCard.front}
              </h3>
            </div>

            <!-- Rodapé do Cartão com Dica -->
            <div class="pt-6 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-teal-600">
              <span>🔄 Clica em qualquer ponto para ${this.isFlipped ? "ver a pergunta" : "revelar a resposta"}</span>
              <span class="text-slate-400">${this.activeCardIndex + 1}/${cards.length}</span>
            </div>
          </div>

          <!-- Botoeira de Autoavaliação do Aluno -->
          <div class="flex items-center justify-center gap-3 mt-4">
            <button id="btn-mark-mastered" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-5 py-2.5 rounded-2xl text-xs sm:text-sm shadow-md transition flex items-center gap-2 transform active:scale-95">
              <span>✅</span>
              <span>Já Sei Bem! (+1 Ponto)</span>
            </button>
            <button id="btn-mark-review" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-black px-5 py-2.5 rounded-2xl text-xs sm:text-sm transition flex items-center gap-2 transform active:scale-95">
              <span>🔄</span>
              <span>Preciso Rever</span>
            </button>
          </div>

          <!-- Navegação entre Cartões -->
          <div class="flex items-center justify-between mt-6 px-4">
            <button id="btn-prev-card" class="bg-white border border-slate-200 hover:bg-slate-50 font-bold px-5 py-2.5 rounded-2xl text-xs sm:text-sm text-slate-700 shadow-sm transition ${this.activeCardIndex === 0 ? "opacity-30 cursor-not-allowed" : ""}" ${this.activeCardIndex === 0 ? "disabled" : ""}>
              ← Anterior
            </button>
            <div class="flex items-center gap-2">
              <button id="btn-shuffle-cards" class="text-slate-400 hover:text-slate-600 text-xs font-bold p-1" title="Baralhar cartões">
                🔀 Baralhar
              </button>
              <div class="flex gap-1.5">
                ${cards.map((_, i) => `
                  <span class="w-2.5 h-2.5 rounded-full ${i === this.activeCardIndex ? "bg-teal-600" : (this.masteredCards.has(`${this.selectedSubject}-${i}`) ? "bg-emerald-400" : "bg-slate-300")}"></span>
                `).join("")}
              </div>
            </div>
            <button id="btn-next-card" class="bg-teal-600 hover:bg-teal-700 font-extrabold px-6 py-2.5 rounded-2xl text-xs sm:text-sm text-white shadow-md transition ${this.activeCardIndex === cards.length - 1 ? "opacity-30 cursor-not-allowed" : ""}" ${this.activeCardIndex === cards.length - 1 ? "disabled" : ""}>
              Seguinte →
            </button>
          </div>
        </div>
      ` : `
        <div class="text-center p-12 bg-white rounded-3xl border border-slate-200">
          <p class="text-slate-500 font-bold">Sem cartões disponíveis para esta disciplina.</p>
        </div>
      `}
    `;
  }

  // =========================================================================
  // ABA 2: POMODORO DOS PEQUENOS GÉNSIOS (TEMPORIZADOR)
  // =========================================================================
  _renderPomodoroTab() {
    const minutesStr = String(this.pomodoro.minutes).padStart(2, "0");
    const secondsStr = String(this.pomodoro.seconds).padStart(2, "0");
    const totalSecs = this.pomodoro.initialMinutes * 60;
    const currentSecs = this.pomodoro.minutes * 60 + this.pomodoro.seconds;
    const progress = totalSecs > 0 ? Math.round(((totalSecs - currentSecs) / totalSecs) * 100) : 0;

    return `
      <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Cartão Principal do Temporizador -->
        <div class="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border-4 ${this.pomodoro.isBreak ? "border-amber-400" : "border-indigo-400"} text-center relative overflow-hidden">
          
          <!-- Badge de Estado -->
          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider mb-4 ${this.pomodoro.isBreak ? "bg-amber-100 text-amber-800" : "bg-indigo-100 text-indigo-800"}">
            <span>${this.pomodoro.isBreak ? "🥤 Pausa Divertida dos Génios" : "🎯 Sessão de Foco Total"}</span>
          </div>

          <!-- Contagem Decrescente Gigante -->
          <div class="text-6xl sm:text-8xl font-black font-mono tracking-tight text-slate-800 my-4 select-none">
            ${minutesStr}:${secondsStr}
          </div>

          <!-- Barra de Progresso Visual -->
          <div class="w-full bg-slate-100 rounded-full h-3 mb-6 overflow-hidden">
            <div class="h-full bg-gradient-to-r ${this.pomodoro.isBreak ? "from-amber-400 to-orange-500" : "from-teal-400 via-indigo-500 to-purple-600"} transition-all duration-1000" style="width: ${progress}%"></div>
          </div>

          <!-- Presets Rápidos de Estudo para Crianças -->
          <div class="flex flex-wrap justify-center gap-2 mb-8">
            <button class="btn-pomodoro-preset px-4 py-2 rounded-xl text-xs font-black border transition ${this.pomodoro.initialMinutes === 15 && !this.pomodoro.isBreak ? "bg-indigo-600 text-white border-indigo-600 shadow" : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"}" data-mins="15" data-break="false">
              15 min (1º e 2º Ano)
            </button>
            <button class="btn-pomodoro-preset px-4 py-2 rounded-xl text-xs font-black border transition ${this.pomodoro.initialMinutes === 20 && !this.pomodoro.isBreak ? "bg-indigo-600 text-white border-indigo-600 shadow" : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"}" data-mins="20" data-break="false">
              20 min (3º e 4º Ano)
            </button>
            <button class="btn-pomodoro-preset px-4 py-2 rounded-xl text-xs font-black border transition ${this.pomodoro.isBreak ? "bg-amber-500 text-white border-amber-500 shadow" : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"}" data-mins="5" data-break="true">
              5 min (Pausa para Água 🥤)
            </button>
          </div>

          <!-- Botões de Controlo -->
          <div class="flex items-center justify-center gap-4">
            ${!this.pomodoro.isRunning ? `
              <button id="btn-start-pomodoro" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black px-8 py-4 rounded-2xl text-base shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
                <span>▶️</span>
                <span>${this.pomodoro.isBreak ? "Começar Pausa" : "Começar Foco"}</span>
              </button>
            ` : `
              <button id="btn-pause-pomodoro" class="bg-amber-500 hover:bg-amber-600 text-white font-black px-8 py-4 rounded-2xl text-base shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
                <span>⏸️</span>
                <span>Pausar</span>
              </button>
            `}

            <button id="btn-reset-pomodoro" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-5 py-4 rounded-2xl text-sm transition flex items-center gap-2" title="Reiniciar tempo">
              <span>🔄</span>
              <span>Reiniciar</span>
            </button>
          </div>

          <!-- Contador de Sessões Concluídas -->
          <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-center gap-2 text-xs font-extrabold text-slate-500">
            <span>Sessões de Foco Hoje:</span>
            <span class="bg-amber-100 text-amber-900 px-3 py-1 rounded-full text-xs font-black flex items-center gap-1">
              <span>⭐</span>
              <span>${this.pomodoro.sessionsCompleted} concluídas</span>
            </span>
          </div>
        </div>

        <!-- Caixa de Dica da Sofia sobre o Pomodoro -->
        <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 rounded-3xl border border-indigo-200 flex items-start gap-4">
          <div class="text-3xl">🦉</div>
          <div>
            <h4 class="font-black text-indigo-950 text-sm mb-1">Como funciona o Pomodoro para Crianças?</h4>
            <p class="text-xs text-indigo-800 leading-relaxed">
              O cérebro aprende muito melhor em períodos curtos e sem distrações! 
              Coloca o telemóvel noutra divisão, fecha abas desnecessárias e foca-te num único exercício. 
              Quando o temporizador apitar, celebra e descansa a cabeça durante 5 minutos!
            </p>
          </div>
        </div>

      </div>
    `;
  }

  // =========================================================================
  // ABA 3: SOFIA EXPLICA-ME (TUTOR DE DÚVIDAS INTERATIVO)
  // =========================================================================
  _renderTutorTab() {
    let doubts = STUDY_SUPPORT_DATA.frequentDoubts || [];

    // Filtro por Disciplina
    if (this.tutorFilterSubject !== "all") {
      doubts = doubts.filter(d => d.subject === this.tutorFilterSubject);
    }

    // Filtro por Pesquisa
    if (this.tutorSearchQuery.trim()) {
      const q = this.tutorSearchQuery.toLowerCase();
      doubts = doubts.filter(d => 
        d.question.toLowerCase().includes(q) || 
        d.answer.toLowerCase().includes(q) ||
        d.subjectName.toLowerCase().includes(q)
      );
    }

    return `
      <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Barra de Pesquisa e Filtros -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
          <div class="flex items-center gap-3 bg-slate-50 border-2 border-slate-300 focus-within:border-teal-500 rounded-2xl px-4 py-3 mb-4">
            <span class="text-xl">🔍</span>
            <input type="text" id="input-tutor-search" class="w-full bg-transparent text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none" placeholder="Escreve a tua dúvida... (ex: tabuada, nomes próprios, ecopontos, água, etc.)" value="${this.tutorSearchQuery}">
            ${this.tutorSearchQuery ? `
              <button id="btn-clear-search" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            ` : ""}
          </div>

          <!-- Filtro por Pílulas de Disciplina -->
          <div class="flex flex-wrap gap-1.5 text-xs font-bold">
            <button class="btn-filter-tutor px-3 py-1.5 rounded-xl border transition ${this.tutorFilterSubject === "all" ? "bg-teal-600 text-white border-teal-600 shadow-sm" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"}" data-subject="all">
              Todas
            </button>
            ${CURRICULUM_PT.subjects.map(s => `
              <button class="btn-filter-tutor px-3 py-1.5 rounded-xl border transition flex items-center gap-1 ${this.tutorFilterSubject === s.id ? "bg-teal-600 text-white border-teal-600 shadow-sm" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"}" data-subject="${s.id}">
                <span>${s.emoji}</span>
                <span>${s.name}</span>
              </button>
            `).join("")}
          </div>
        </div>

        <!-- Lista de Dúvidas Inteligentes -->
        <div class="space-y-4">
          ${doubts.length > 0 ? doubts.map((d, idx) => `
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 hover:border-teal-400 transition cursor-pointer doubt-accordion-card" data-index="${idx}">
              <div class="flex items-start justify-between gap-4">
                <div class="flex items-start gap-3">
                  <span class="text-2xl mt-0.5">${d.emoji || "🦉"}</span>
                  <div>
                    <span class="text-[11px] font-black uppercase tracking-wider text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full">
                      ${d.subjectName}
                    </span>
                    <h3 class="font-black text-base sm:text-lg text-slate-800 mt-1 leading-snug">
                      ${d.question}
                    </h3>
                  </div>
                </div>

                <button class="btn-speak-doubt flex-shrink-0 bg-teal-50 hover:bg-teal-100 text-teal-700 px-3 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1 shadow-sm" data-question="${d.question}" data-answer="${d.answer}">
                  <span>🔊</span>
                  <span class="hidden sm:inline">Ouvir</span>
                </button>
              </div>

              <!-- Resposta com Dica de Ouro -->
              <div class="doubt-answer-body mt-4 pt-4 border-t border-slate-100 space-y-3">
                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium">
                  ${d.answer}
                </p>

                ${d.owlTip ? `
                  <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-start gap-2.5 text-xs text-amber-900 font-bold">
                    <span class="text-lg">💡</span>
                    <div>
                      <span class="font-black block uppercase text-[10px] text-amber-800">Dica de Ouro da Sofia:</span>
                      ${d.owlTip}
                    </div>
                  </div>
                ` : ""}
              </div>
            </div>
          `).join("") : `
            <div class="text-center p-12 bg-white rounded-3xl border border-slate-200">
              <span class="text-4xl block mb-2">🔍</span>
              <p class="text-slate-700 font-black text-sm">Não encontramos nenhuma dúvida com essa palavra.</p>
              <p class="text-slate-400 text-xs mt-1">Experimenta pesquisar por 'tabuada', 'nomes próprios', 'água' ou 'ecoponto'!</p>
            </div>
          `}
        </div>

        <!-- Caixa Interativa: Tens Outra Dúvida? Pergunta à Sofia! -->
        <div class="bg-gradient-to-br from-teal-50 via-emerald-50 to-cyan-50 rounded-3xl p-6 sm:p-8 border-2 border-teal-200 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-3xl">🦉</span>
            <div>
              <h3 class="font-black text-slate-800 text-base">Tens outra pergunta? Pergunta diretamente à Sofia!</h3>
              <p class="text-xs text-slate-500 font-bold">A Sofia dá-te uma dica amiga para aprenderes a descobrir a resposta.</p>
            </div>
          </div>

          <div class="flex gap-2">
            <input type="text" id="input-ask-sofia" class="flex-1 bg-white border-2 border-teal-300 rounded-2xl px-4 py-3 text-xs sm:text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-teal-500 shadow-sm" placeholder="Escreve aqui qualquer pergunta...">
            <button id="btn-submit-ask-sofia" class="bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-black px-5 py-3 rounded-2xl text-xs sm:text-sm shadow-md transition flex items-center gap-1.5 flex-shrink-0 transform active:scale-95">
              <span>💡</span>
              <span>Responder</span>
            </button>
          </div>

          ${this.customAnswer ? `
            <div class="mt-4 p-4 bg-white rounded-2xl border-2 border-teal-300 shadow-sm">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-black text-teal-800 uppercase flex items-center gap-1">
                  <span>🦉</span> A Sofia Responde:
                </span>
                <button id="btn-speak-custom-answer" class="text-teal-600 hover:text-teal-700 font-black text-xs flex items-center gap-1">
                  <span>🔊</span> Ouvir
                </button>
              </div>
              <p class="text-xs sm:text-sm font-bold text-slate-700 leading-relaxed">
                ${this.customAnswer}
              </p>
            </div>
          ` : ""}
        </div>

      </div>
    `;
  }

  // =========================================================================
  // ABA 4: MÉTODOS DE ESTUDO & CANTINHO DE ESTUDO
  // =========================================================================
  _renderMethodsTab() {
    return `
      <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Cartões de Métodos Científicos para Crianças -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          ${STUDY_SUPPORT_DATA.methods.map(m => `
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 flex flex-col justify-between hover:border-teal-300 transition group">
              <div>
                <div class="text-4xl mb-4 group-hover:scale-110 transition transform duration-300">${m.icon}</div>
                <h3 class="text-lg font-black text-slate-800 mb-2">${m.title}</h3>
                <p class="text-slate-600 text-xs sm:text-sm leading-relaxed font-medium">${m.desc}</p>
              </div>
              <button class="btn-speak-method mt-6 bg-teal-50 hover:bg-teal-100 text-teal-800 font-black px-4 py-2.5 rounded-2xl text-xs transition flex items-center gap-2 self-start shadow-sm" data-text="${m.title}. ${m.desc}">
                <span>🔊</span> Ouvir Conselho da Sofia
              </button>
            </div>
          `).join("")}
        </div>

        <!-- Checklist Interativo: O Meu Cantinho de Estudo Perfeito -->
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-3xl p-6 sm:p-8 border-2 border-amber-200 shadow-sm">
          <div class="flex items-center gap-3 mb-4">
            <span class="text-3xl">🏠</span>
            <div>
              <h3 class="text-lg font-black text-amber-950">O Meu Cantinho de Estudo Perfeito</h3>
              <p class="text-xs text-amber-800 font-bold">Verifica se tens tudo pronto antes de abrir os livros:</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm font-bold text-amber-950">
            <label class="flex items-center gap-3 p-3 bg-white/80 rounded-2xl border border-amber-200 cursor-pointer hover:bg-white transition">
              <input type="checkbox" class="w-5 h-5 rounded-lg text-teal-600 accent-teal-600 cursor-pointer" checked>
              <span>Mesa limpa, arrumada e com espaço</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-white/80 rounded-2xl border border-amber-200 cursor-pointer hover:bg-white transition">
              <input type="checkbox" class="w-5 h-5 rounded-lg text-teal-600 accent-teal-600 cursor-pointer" checked>
              <span>Boa luz natural ou candeeiro forte</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-white/80 rounded-2xl border border-amber-200 cursor-pointer hover:bg-white transition">
              <input type="checkbox" class="w-5 h-5 rounded-lg text-teal-600 accent-teal-600 cursor-pointer">
              <span>Garrafa ou copo de água por perto</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-white/80 rounded-2xl border border-amber-200 cursor-pointer hover:bg-white transition">
              <input type="checkbox" class="w-5 h-5 rounded-lg text-teal-600 accent-teal-600 cursor-pointer" checked>
              <span>Televisão e telemóvel desligados ou noutra sala</span>
            </label>
          </div>
        </div>

      </div>
    `;
  }

  // =========================================================================
  // MODAL DE RESUMO COMPLETO ILUSTRADO DA DISCIPLINA
  // =========================================================================
  _renderSummaryModal(subjectId) {
    const summary = STUDY_SUPPORT_DATA.subjectSummaries[subjectId];
    if (!summary) return "";

    return `
      <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-sans overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-3xl w-full shadow-2xl border-4 border-teal-300 max-h-[90vh] flex flex-col overflow-hidden my-4">
          
          <!-- Cabeçalho do Resumo -->
          <div class="bg-gradient-to-r from-teal-500 to-emerald-600 p-6 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-4xl">${summary.emoji}</span>
              <div>
                <span class="text-[11px] font-black uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">
                  ${summary.yearBadge}
                </span>
                <h2 class="text-xl sm:text-2xl font-black mt-0.5">${summary.title}</h2>
              </div>
            </div>
